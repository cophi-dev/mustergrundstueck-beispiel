# GitHub Pages Deployment
#
# SETUP REQUIRED (one-time, by repository admin):
# 1. Go to Settings → Pages
# 2. Under "Build and deployment", select "GitHub Actions" as the source
# 3. Save - the workflow will then deploy automatically on push
#
# After setup, the site will be live at:
# https://cophi-dev.github.io/mustergrundstueck-beispiel/

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
