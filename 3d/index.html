<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>3D-Ansicht – Ashausener Str. 12</title>
  <style>
    :root { --ink: #1f2a33; --muted: #5d6a74; --accent: #2f5d50; --ok: #1f7a4d; --bad: #b23b2e; --panelH: 0px; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fa1b2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
    canvas { display: block; touch-action: none; }
    #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #234; font-size: 15px; pointer-events: none; text-align: center; padding: 0 20px; }
    #caption { position: fixed; left: 12px; bottom: 12px; max-width: calc(100vw - 24px); padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,.88); font-size: 13px; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
    #hint { position: fixed; right: 12px; bottom: 12px; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,.7); color: #444; font-size: 12px; pointer-events: none; }
    #viewlabel { position: fixed; left: 14px; top: 64px; max-width: calc(100vw - 380px); padding: 8px 14px; border-radius: 8px; background: rgba(31,42,51,.82); color: #fff; font: 600 14px system-ui, -apple-system, sans-serif; text-align: center; display: none; pointer-events: none; box-sizing: border-box; }
    #attr { position: fixed; right: 12px; bottom: 44px; color: #222; font-size: 11px; line-height: 1.2; white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 2px #fff; display: none; }
    #attr a { color: #234; }
    #panel { position: fixed; right: 12px; top: 12px; width: 340px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.95); box-shadow: 0 6px 24px rgba(20,30,40,.18); display: none; flex-direction: column; gap: 10px; font-size: 13px; box-sizing: border-box; }
    #panel .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #panel .lbl { width: 44px; color: var(--muted); font-weight: 600; font-size: 12px; }
    .seg { display: inline-flex; flex: 1; background: #eef1f3; border-radius: 9px; padding: 3px; gap: 2px; }
    .seg button { flex: 1; border: 0; background: none; padding: 7px 6px; border-radius: 7px; font: 600 13px system-ui, -apple-system, sans-serif; color: var(--muted); cursor: pointer; min-height: 32px; }
    .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
    .seg button:disabled { opacity: .4; cursor: default; }
    .tgl { flex: 1; border: 1px solid #d5dbe0; background: #fff; border-radius: 9px; padding: 7px 10px; font: 600 13px system-ui, -apple-system, sans-serif; color: var(--ink); cursor: pointer; min-height: 36px; text-align: left; white-space: nowrap; }
    .tgl::before { content: ""; display: inline-block; width: 26px; height: 15px; margin: 0 8px -3px 0; border-radius: 8px; background: #c9d0d6 radial-gradient(circle at 7px 7.5px, #fff 5px, transparent 5.5px); transition: background-color .15s; }
    .tgl.on::before { background: var(--accent) radial-gradient(circle at 19px 7.5px, #fff 5px, transparent 5.5px); }
    #check { display: flex; flex-direction: column; gap: 4px; }
    .badge { align-self: flex-start; padding: 5px 10px; border-radius: 999px; font-weight: 700; font-size: 12.5px; color: #fff; background: var(--ok); }
    .badge.bad { background: var(--bad); }
    #check details { font-size: 12px; color: #333; }
    #check summary { cursor: pointer; color: var(--muted); font-weight: 600; padding: 2px 0; }
    #check details p { margin: 4px 0 0; line-height: 1.45; }
    #pulse { animation: none; }
    .flash { animation: flash 1.2s ease 2; }
    @keyframes flash { 50% { box-shadow: 0 0 0 4px rgba(47,93,80,.45); } }
    @media (max-width: 700px) {
      #hint { display: none; }
      #panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; border-radius: 14px 14px 0 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); gap: 6px; }
      #panel .lbl { display: none; }
      .seg button, .tgl { min-height: 44px; font-size: 14px; }
      #panel .row.split > * { flex: 1 1 0; }
      #caption { bottom: calc(var(--panelH) + 8px); font-size: 12.5px; }
      #attr { right: 8px; bottom: calc(var(--panelH) + 44px); font-size: 10px; }
      #viewlabel { font-size: 13px; top: 56px; left: 8px; max-width: calc(100vw - 20px); }
      .tgl { white-space: nowrap; font-size: 13.5px; padding: 6px 8px; }
      #check { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px; }
      #check details[open] { flex-basis: 100%; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Modell wird geladen …</div>
  <div id="viewlabel"></div>
  <div id="caption">Bestand Ashausener Str. 12</div>
  <div id="panel" aria-label="Steuerung">
    <div class="row split"><button id="v1" class="tgl on" type="button" aria-pressed="true">Bungalow anzeigen</button><button id="sat" class="tgl" type="button" aria-pressed="false">Luftbild</button></div>
    <div class="row" id="posrow"><span class="lbl">Lage</span><div class="seg" id="pos" role="group" aria-label="Lage des Bungalows"><button type="button" data-k="ost" class="on">Ost</button><button type="button" data-k="mitte">Mitte</button><button type="button" data-k="west">West</button></div></div>
    <div id="check"><span class="badge" id="badge">✓ Abstände und Größe vorgeprüft</span><details><summary>Details</summary><p id="checkdetails"></p></details></div>
    <div class="row"><span class="lbl">Blick</span><div class="seg" id="views" role="group" aria-label="Blick"><button type="button" data-v="overview" class="on">Übersicht</button><button type="button" data-v="innen_bu">Innen Bungalow</button><button type="button" data-v="innen_be">Innen Bestand</button></div></div>
  </div>
  <div id="attr">Luftbild: © <a href="https://www.lgln.niedersachsen.de" target="_blank" rel="noopener">LGLN</a> (DOP20), Lizenz <a href="https://www.govdata.de/dl-de/by-2-0" target="_blank" rel="noopener">dl-de/by-2-0</a></div>
  <div id="hint">Ziehen: drehen · Scrollen: zoomen · Rechtsklick: verschieben</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    const BASE = '/3d/';
    let tick = () => {};
    const status = document.getElementById('status');
    // Small or touch screens: lighter model (512 px textures), smaller shadows, capped pixel ratio.
    const MOBILE = window.matchMedia('(pointer: coarse)').matches || window.innerWidth < 700;
    const HORIZON = 0x9fa1b2;   // rendered sky colour at the horizon, so the fogged ground meets the sky without a seam

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: MOBILE ? 'low-power' : 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, MOBILE ? 1.5 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    renderer.domElement.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      document.body.insertAdjacentHTML('beforeend', '<div id="status">Grafikspeicher erschöpft – bitte Seite neu laden.</div>');
    });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(HORIZON);
    scene.fog = new THREE.Fog(HORIZON, 70, 320);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 2000);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.03;

    // Sky / reflections: Poly Haven kloofendal_48d_puresky (CC0), LDR equirect (same HDRI as the Blender renders).
    new THREE.TextureLoader().load(BASE + (MOBILE ? 'sky_1k.jpg' : 'sky_2k.jpg'), (tex) => {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      scene.background = tex;
      scene.environment = tex;
      scene.environmentIntensity = 0.9;
    });

    scene.add(new THREE.HemisphereLight(0xdfeeff, 0x5d6b45, 0.35));
    const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.03;
    sun.shadow.radius = 3;
    scene.add(sun, sun.target);
    const SUN_DIR = new THREE.Vector3(0.55, 0.85, 0.75).normalize();   // same sun direction as the Blender renders

    // ---- low-poly vegetation (positions/heights from build_bestand_nr12_v2.py), instanced
    function buildTrees(list) {
      const toGl = (x, y) => new THREE.Vector3(x, 0, -y);   // Blender (x, y, z-up) -> glTF/three (x, z, -y)
      const cyl = new THREE.CylinderGeometry(1, 1, 1, 7); cyl.translate(0, 0.5, 0);
      const cone = new THREE.ConeGeometry(1, 1, 9);
      const ball = new THREE.IcosahedronGeometry(1, 2);
      const flat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, flatShading: true });
      const parts = { trunk: [], needle: [], leaf: [] };
      const m4 = (pos, scl, yaw = 0) => new THREE.Matrix4().compose(pos, new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw), scl);
      let seed = 12; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (const [k, x, y, h, r] of list) {
        const p = toGl(x, y), yaw = rnd() * Math.PI * 2, tone = 0.85 + rnd() * 0.3;
        const base = m4(p, new THREE.Vector3(1, 1, 1), yaw);
        const add = (key, pos, scl) => parts[key].push([base.clone().multiply(m4(pos, scl)), tone]);
        if (k === 'con') {
          const tr = Math.max(0.12, r * 0.09);
          add('trunk', new THREE.Vector3(0, 0, 0), new THREE.Vector3(tr, h * 0.25, tr));
          for (const [z0, z1, rr] of [[h * 0.12, h * 0.7, r], [h * 0.45, h, r * 0.62]])
            add('needle', new THREE.Vector3(0, (z0 + z1) / 2, 0), new THREE.Vector3(rr, z1 - z0, rr));
        } else {
          const tr = Math.max(0.14, r * 0.08);
          add('trunk', new THREE.Vector3(0, 0, 0), new THREE.Vector3(tr, h - r * 0.9, tr));
          for (const [dx, dy, dz, s] of [[0, 0, 0, 1], [r * 0.45, r * 0.2, -r * 0.25, 0.7], [-r * 0.4, -r * 0.3, -r * 0.2, 0.68]])
            add('leaf', new THREE.Vector3(dx, h - r + dz, -dy), new THREE.Vector3(r * s, r * s * 0.85, r * s));
        }
      }
      const group = new THREE.Group(); group.name = 'Vegetation'; group.userData.count = list.length;
      const defs = { trunk: [cyl, flat(0x5e5246)], needle: [cone, flat(0x46573f)], leaf: [ball, flat(0x6f8456)] };
      const c = new THREE.Color();
      for (const [key, [geo, mat]] of Object.entries(defs)) {
        const items = parts[key]; if (!items.length) continue;
        const im = new THREE.InstancedMesh(geo, mat, items.length);
        items.forEach(([m, t], i) => { im.setMatrixAt(i, m); im.setColorAt(i, c.setScalar(t)); });
        im.castShadow = true; im.receiveShadow = true;
        im.computeBoundingSphere();
        group.add(im);
      }
      return group;
    }

    // Glas: von beiden Seiten durchsichtig (vorher opak → von innen "blind").
    const fixGlass = (root) => root.traverse((o) => {
      if (!o.isMesh || !/glas/i.test(o.name + ' ' + (o.material && o.material.name))) return;
      const m = o.material.clone();
      m.transparent = true; m.opacity = 0.28; m.depthWrite = false; m.side = THREE.DoubleSide;
      m.color.setRGB(0.55, 0.68, 0.75); m.metalness = 0; m.roughness = 0.05;
      o.material = m; o.castShadow = false; o.renderOrder = 2;
    });

    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);
    const vegPromise = fetch(BASE + 'vegetation.json').then((r) => r.json()).catch((e) => { console.warn('vegetation.json', e); return { trees: [] }; });

    loader.load(BASE + (MOBILE ? 'bestand_nr12_v2_mobile.glb' : 'bestand_nr12_v2.glb'), async (gltf) => {
      const root = gltf.scene;
      fixGlass(root);
      // Fit to the buildings/plots, not to the large ground plane.
      const box = new THREE.Box3(), tmp = new THREE.Box3(), size = new THREE.Vector3();
      root.updateMatrixWorld(true);
      root.traverse((o) => {
        if (!o.isMesh) return;
        // The grass texture exports without Blender's green tint; restore it.
        if (o.material && o.material.name === 'grass') o.material.color.setRGB(0.62, 0.85, 0.45);
        tmp.setFromObject(o); tmp.getSize(size);
        const large = Math.max(size.x, size.z) > 120;
        o.castShadow = !large;
        o.receiveShadow = true;
        if (!large) box.union(tmp);
      });
      if (box.isEmpty()) box.setFromObject(root);
      scene.add(root);

      const vj = await vegPromise, all = vj.trees || [];
      // Plot-Frame 121/2 (bungalow/v1_layout.py): u entlang Grenze 121/1|121/2, v Richtung Am Osterfeld
      const PO = [-22.614073, 10.959574], PU = [0.786761, 0.617258], PV = [-0.617258, 0.786761], U0_V1 = 14.40, BU_W = 19.0, BU_V0 = 3.03, BU_D = 9.2;
      const toUV = (x, y) => [(x - PO[0]) * PU[0] + (y - PO[1]) * PU[1], (x - PO[0]) * PV[0] + (y - PO[1]) * PV[1]];
      // Vorprüfung 14./15.10.26: Lageplan-Geometrie ±0,25 m; GRZ 0,25 lt. B-Plan 32/50 (BauNVO 1977, § 19 Abs. 4: Terrasse/Stellplätze nicht angerechnet),
      // 121/2 = eigenes Baugrundstück 701 m²; NBauO § 5: 0,5 H (H 3,40 m) = 1,70 m, mind. 3 m.
      const GR_TXT = 'Grundfläche 174,8 m², zulässig 175,3 m² (GRZ 0,25 auf 701 m²).';
      const POS = {
        ost:   { u: 14.40, ok: true, d: 'Abstände zu den Grenzen: Süd 3,03 m · Ost 3,04 m · Nord 7,02 m · West 14,34 m (mind. 3,00 m). Zur Garage 6,04 m, zum Gerätehaus 5,98 m.' },
        mitte: { u: 8.70,  ok: true, d: 'Abstände zu den Grenzen: Süd 3,03 m · West 8,64 m · Ost 8,74 m · Nord 7,02 m (mind. 3,00 m). Zur Garage 6,73 m, zum Gerätehaus 5,98 m.' },
        west:  { u: 3.13,  ok: true, d: 'Abstände zu den Grenzen: Süd 3,03 m · West 3,07 m · Nord 7,02 m · Ost 14,31 m (mind. 3,00 m). Zur Garage 10,46 m, zum Gerätehaus 6,95 m.' }
      };
      let posU = U0_V1, posK = 'ost';
      const isFelled = (t) => {
        if (posU === U0_V1) return (vj.felled_v1 || []).some(([x, y]) => Math.abs(t[1] - x) < 0.05 && Math.abs(t[2] - y) < 0.05);
        const [u, v] = toUV(t[1], t[2]);   // andere Lage: Bäume im Baufeld (+1,5 m) und auf der Terrasse
        return u > posU - 1.5 && u < posU + BU_W + 1.5 && v > BU_V0 - 3.5 && v < BU_V0 + BU_D + 1.5;
      };
      let veg = buildTrees(all.filter((t) => !isFelled(t)));
      let vegFelled = buildTrees(all.filter(isFelled));
      scene.add(veg, vegFelled);
      veg.userData.count = all.length;
      const rebuildTrees = () => {
        const vis = vegFelled.visible; scene.remove(veg, vegFelled);
        veg = buildTrees(all.filter((t) => !isFelled(t))); vegFelled = buildTrees(all.filter(isFelled));
        vegFelled.visible = vis; scene.add(veg, vegFelled);
      };

      // ---- Luftbild LGLN DOP20 (dl-de/by-2-0), 240 x 240 m, EPSG:25832, per Flurstück 121/2 eingepasst (Abw. < 1 cm)
      const SAT = [[-159.934, 26.697], [-34.046, -174.112], [166.762, -48.223], [40.874, 152.585]];   // NW, NE, SE, SW (three x, z)
      const satGeo = new THREE.BufferGeometry();
      satGeo.setAttribute('position', new THREE.Float32BufferAttribute(SAT.flatMap(([x, z]) => [x, 0.006, z]), 3));
      satGeo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 1, 0, 0, 0], 2));
      satGeo.setIndex([0, 3, 1, 1, 3, 2]); satGeo.computeVertexNormals();
      const fade = document.createElement('canvas'); fade.width = fade.height = 128;
      { const g = fade.getContext('2d'), gr = g.createRadialGradient(64, 64, 40, 64, 64, 64); gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#000'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }
      const satMat = new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0, transparent: true, alphaMap: new THREE.CanvasTexture(fade), polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
      const satMesh = new THREE.Mesh(satGeo, satMat); satMesh.receiveShadow = true; satMesh.visible = false; satMesh.renderOrder = 1; scene.add(satMesh);
      const satBtn = document.getElementById('sat'), attr = document.getElementById('attr');
      let satLoaded = false;
      const setSat = (on) => {
        satBtn.classList.toggle('on', on); satBtn.setAttribute('aria-pressed', on);
        attr.style.display = on ? 'block' : 'none';
        if (on && !satLoaded) {
          satLoaded = true; satBtn.textContent = 'Luftbild lädt …';
          new THREE.TextureLoader().load(BASE + (MOBILE ? 'luftbild_1k.jpg' : 'luftbild_2k.jpg'), (t) => {
            t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
            satMat.map = t; satMat.needsUpdate = true; satMesh.visible = satBtn.classList.contains('on');
            satBtn.textContent = 'Luftbild'; window.__satReady = true;
          });
        } else satMesh.visible = on && !!satMat.map;
      };
      satBtn.addEventListener('click', () => setSat(!satBtn.classList.contains('on')));
      if (new URLSearchParams(location.search).has('luftbild')) setSat(true);
      const shadowBox = box.clone().union(new THREE.Box3().setFromObject(veg)).union(new THREE.Box3().setFromObject(vegFelled));

      // ---- Startkamera: Übersicht schräg von oben, Bestand + Bungalow (alle Lagen) komplett im Bild
      const focus = new THREE.Box3(new THREE.Vector3(-26, 0, -42), new THREE.Vector3(14, 6, 2));   // Haus, Nebengebäude, 121/2
      const center = focus.getCenter(new THREE.Vector3());
      const radius = focus.getSize(new THREE.Vector3()).length() / 2;
      const fitDist = () => radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) / Math.min(1, Math.max(0.55, camera.aspect)) * 1.0;
      const OV_DIR = new THREE.Vector3(0.75, 0.75, 0.62).normalize();
      controls.maxDistance = fitDist() * 3;
      const overview = () => {   // Desktop: Modell links vom Bedienfeld
        const right = new THREE.Vector3(0, 1, 0).cross(OV_DIR).normalize(), t = center.clone();
        if (innerWidth > 700) t.addScaledVector(right, radius * 0.05);
        return { pos: t.clone().addScaledVector(OV_DIR, fitDist()), target: t, fov: 40 };
      };
      { const o = overview(); camera.position.copy(o.pos); controls.target.copy(o.target); controls.minDistance = 2; controls.update(); }

      const sc = shadowBox.getCenter(new THREE.Vector3());
      const sr = shadowBox.getSize(new THREE.Vector3()).length() / 2;
      sun.position.copy(sc).addScaledVector(SUN_DIR, sr * 2);
      sun.target.position.copy(sc);
      const s = sun.shadow.camera;
      s.left = s.bottom = -sr; s.right = s.top = sr;
      s.near = 0.5; s.far = sr * 4;
      s.updateProjectionMatrix();

      status.remove();
      window.__view = { camera, controls };   // für automatische Screenshots
      window.__viewerReady = { trees: veg.userData.count, mobile: MOBILE };

      // ---- sanfte Kamerafahrten + Bungalow-Verschiebung
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      let camTween = null, buTween = null;
      const flyTo = (v, dur = 1300) => { camTween = { t0: performance.now(), dur, p0: camera.position.clone(), q0: controls.target.clone(), f0: camera.fov, ...v }; };
      tick = () => {
        const now = performance.now();
        if (camTween) {
          const k = Math.min(1, (now - camTween.t0) / camTween.dur), e = ease(k);
          camera.position.lerpVectors(camTween.p0, camTween.pos, e); controls.target.lerpVectors(camTween.q0, camTween.target, e);
          camera.fov = camTween.f0 + (camTween.fov - camTween.f0) * e; camera.updateProjectionMatrix();
          if (k >= 1) camTween = null;
        }
        if (buTween && bungalow) {
          const k = Math.min(1, (now - buTween.t0) / 900);
          bungalow.position.lerpVectors(buTween.a, buTween.b, ease(k)); if (k >= 1) buTween = null;
        }
      };
      const buOffset = (u) => new THREE.Vector3(PU[0] * (u - U0_V1), 0, -PU[1] * (u - U0_V1));

      // ---- Innenansichten (Augenhöhe 1,60 m über Fußboden, Blick durchs Fenster)
      const viewLabel = document.getElementById('viewlabel');
      const hemi = scene.children.find((o) => o.isHemisphereLight);
      const setInterior = (on) => { hemi.intensity = on ? 1.1 : 0.35; scene.environmentIntensity = on ? 1.3 : 0.9; controls.minDistance = on ? 0.05 : 2; };
      const VIEWS = {
        overview: () => ({ ...overview(), label: '' }),
        innen_bu: () => {   // Wohnzimmer Bungalow (Südfassade), Blick über den Garten zum Bestandshaus
          const o = buOffset(posU), eye = new THREE.Vector3(-1.53, 1.60, -34.15).add(o);
          const tgt = eye.clone().add(new THREE.Vector3(5.7, 1.4, -4.3).sub(eye).setY(0).normalize().multiplyScalar(1.2)); tgt.y = 1.45;
          return { pos: eye, target: tgt, fov: 62, label: 'Blick aus dem Wohnzimmer des Bungalows Richtung Bestandshaus' };
        },
        innen_be: () => {   // Bestandshaus EG, Rückseite (Gartenfenster), Blick zum Bungalow
          const eye = new THREE.Vector3(9.3, 2.06, -7.35), b = new THREE.Vector3(-8.5, 1.6, -31.7).add(buOffset(posU));
          const tgt = eye.clone().add(b.sub(eye).setY(0).normalize().multiplyScalar(1.2)); tgt.y = 1.95;
          return { pos: eye, target: tgt, fov: 62, label: 'Blick aus dem Erdgeschoss des Bestandshauses in den Garten' };
        }
      };
      let curView = 'overview';
      const viewBtns = document.querySelectorAll('#views button');
      const goView = (k, dur) => {
        if (k === 'innen_bu' && !btn.classList.contains('on')) setV1(true);
        curView = k; viewBtns.forEach((b) => b.classList.toggle('on', b.dataset.v === k));
        const v = VIEWS[k](); setInterior(k !== 'overview'); flyTo(v, dur);
        viewLabel.textContent = v.label; viewLabel.style.display = v.label ? 'block' : 'none';
      };
      viewBtns.forEach((b) => b.addEventListener('click', () => goView(b.dataset.v)));

      // ---- Bungalow + Lage
      const btn = document.getElementById('v1'), caption = document.getElementById('caption'), posBtns = document.querySelectorAll('#pos button');
      const badge = document.getElementById('badge'), details = document.getElementById('checkdetails'), check = document.getElementById('check'), posRow = document.getElementById('posrow');
      const updCaption = () => { caption.textContent = btn.classList.contains('on') ? `Bestand + Bungalow (Vorentwurf) · Lage ${posK[0].toUpperCase() + posK.slice(1)}` : 'Bestand Ashausener Str. 12 (heute)'; };
      const setPos = (k, animate = true) => {
        const p = POS[k]; if (!p) return;
        posK = k; posU = p.u; posBtns.forEach((b) => b.classList.toggle('on', b.dataset.k === k));
        if (bungalow) { if (animate) buTween = { t0: performance.now(), a: bungalow.position.clone(), b: buOffset(posU) }; else bungalow.position.copy(buOffset(posU)); }
        rebuildTrees(); vegFelled.visible = !btn.classList.contains('on');
        badge.textContent = p.ok ? '✓ Abstände und Größe vorgeprüft' : '✗ Abstand zur Grenze zu gering'; badge.classList.toggle('bad', !p.ok);
        details.textContent = `${GR_TXT} ${p.d} Vorprüfung nach Lageplan (±0,25 m), keine Bauvorlage.`;
        updCaption();
        if (curView !== 'overview') goView(curView, 900);
      };
      posBtns.forEach((b) => b.addEventListener('click', () => setPos(b.dataset.k)));
      let bungalow = null, loading = false;
      const setV1 = (on) => {
        btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on);
        vegFelled.visible = !on; posRow.style.display = check.style.display = on ? '' : 'none';
        viewBtns[1].disabled = false;
        if (bungalow) bungalow.visible = on;
        updCaption();
        if (!bungalow && !loading) {   // immer laden: Straße Am Osterfeld steckt im Bungalow-GLB
          loading = true;
          loader.load(BASE + 'bungalow_v1.glb', (g) => {
            bungalow = g.scene;
            bungalow.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
            fixGlass(bungalow);
            // Straße/Gehweg Am Osterfeld gehören nicht zum Bungalow → dauerhaft sichtbar.
            bungalow.children.filter((o) => !/^BU_/.test(o.name)).forEach((o) => scene.attach(o));
            bungalow.visible = btn.classList.contains('on');
            bungalow.position.copy(buOffset(posU));
            scene.add(bungalow);
            window.__v1Ready = true;
          }, undefined, (e) => { console.error(e); btn.textContent = 'Bungalow nicht verfügbar'; });
        }
      };
      btn.addEventListener('click', () => setV1(!btn.classList.contains('on')));
      const panel = document.getElementById('panel'); panel.style.display = 'flex';
      new ResizeObserver(() => document.documentElement.style.setProperty('--panelH', (innerWidth <= 700 ? panel.getBoundingClientRect().height : 0) + 'px')).observe(panel);
      const qs = new URLSearchParams(location.search);
      setV1(!qs.has('bestand'));   // Bungalow standardmäßig an; ?bestand = nur Bestand
      setPos({ mitte: 'mitte', west: 'west' }[qs.get('lage')] || 'ost', false);
      if (VIEWS[qs.get('blick')]) goView(qs.get('blick'), 1);
      // Schritte aus der Intro-Karte der Hauptseite
      window.addEventListener('message', (e) => {
        if (e.origin !== location.origin || !e.data || !e.data.cmd) return;
        if (e.data.cmd === 'view') goView(e.data.view);
        if (e.data.cmd === 'lage') { goView('overview'); posRow.classList.remove('flash'); void posRow.offsetWidth; posRow.classList.add('flash'); }
      });
    }, (ev) => {
      if (ev.total) status.textContent = `Modell wird geladen … ${Math.round(ev.loaded / ev.total * 100)} %`;
      else status.textContent = `Modell wird geladen … ${(ev.loaded / 1e6).toFixed(1)} MB`;
    }, (err) => {
      console.error(err);
      status.textContent = 'Modell konnte nicht geladen werden.';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    const loop = () => { tick(); controls.update(); renderer.render(scene, camera); };
    renderer.setAnimationLoop(loop);
    // Paused by the parent page while the plans view is shown (saves GPU/battery).
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data || !('active' in e.data)) return;
      renderer.setAnimationLoop(e.data.active ? loop : null);
    });
  </script>
</body>
</html>
