<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Visualisierung – Ashausener Str. 12</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fa1b2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; touch-action: none; }
    #caption { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,.85); color: #222; font-size: 13px; pointer-events: none; }
    #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #234; font-size: 15px; pointer-events: none; text-align: center; padding: 0 20px; }
    #hint { position: fixed; right: 12px; bottom: 12px; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,.7); color: #444; font-size: 12px; pointer-events: none; }
    @media (max-width: 640px) { #hint { display: none; } }
    #v1 { position: fixed; right: 12px; top: 12px; padding: 8px 12px; border: 1px solid rgba(0,0,0,.12); border-radius: 8px; background: rgba(255,255,255,.92); color: #1f2a33; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; display: none; }
    #v1.on, #sat.on, #pos button.on { background: #2f5d50; border-color: #2f5d50; color: #fff; }
    #sat { position: fixed; right: 12px; top: 54px; padding: 8px 12px; border: 1px solid rgba(0,0,0,.12); border-radius: 8px; background: rgba(255,255,255,.92); color: #1f2a33; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; display: none; }
    #pos { position: fixed; right: 12px; top: 96px; display: none; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 230px; }
    #pos .row { display: flex; gap: 4px; }
    #pos button { padding: 6px 9px; border: 1px solid rgba(0,0,0,.12); border-radius: 7px; background: rgba(255,255,255,.92); color: #1f2a33; font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
    #pos small { background: rgba(255,255,255,.85); border-radius: 6px; padding: 4px 7px; font-size: 11px; color: #333; text-align: right; }
    #attr { position: fixed; right: 12px; bottom: 44px; padding: 0; background: none; color: #222; font-size: 11px; line-height: 1.2; white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 2px #fff; pointer-events: auto; display: none; }
    #attr a { color: #234; }
    @media (max-width: 640px) { #attr { right: 8px; bottom: 6px; font-size: 10px; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Modell wird geladen …</div>
  <div id="caption">Bestand Ashausener Str. 12 – Modell v2</div>
  <button id="v1" type="button" aria-pressed="true">✓ Neubau Bungalow V1</button>
  <button id="sat" type="button" aria-pressed="false">Luftbild einblenden</button>
  <div id="pos"><div class="row"><button type="button" data-u="14.40" class="on">Lage V1 (Ost)</button><button type="button" data-u="8.70">Mitte</button><button type="button" data-u="3.03">West</button></div>
    <small>Lage nur zur Ansicht – Abstandsflächen und GRZ werden dabei nicht automatisch geprüft.</small></div>
  <div id="attr">Luftbild: © <a href="https://www.lgln.niedersachsen.de" target="_blank" rel="noopener">LGLN</a> (DOP20), Lizenz <a href="https://www.govdata.de/dl-de/by-2-0" target="_blank" rel="noopener">dl-de/by-2-0</a></div>
  <div id="hint">Ziehen: drehen · Scrollen/Pinch: zoomen · Rechtsklick bzw. zwei Finger: verschieben</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    const BASE = '/3d/';
    const status = document.getElementById('status');
    // Small or touch screens: lighter model (512 px textures), smaller shadows, capped pixel ratio.
    const MOBILE = window.matchMedia('(pointer: coarse)').matches || window.innerWidth < 700;
    const HORIZON = 0x9fa1b2;   // rendered sky colour at the horizon, so the fogged ground meets the sky without a seam

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: MOBILE ? 'low-power' : 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, MOBILE ? 1.5 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    renderer.domElement.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      document.body.insertAdjacentHTML('beforeend', '<div id="status">Grafikspeicher erschöpft – bitte Seite neu laden.</div>');
    });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(HORIZON);
    scene.fog = new THREE.Fog(HORIZON, 70, 320);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 2000);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.03;

    // Sky / reflections: Poly Haven kloofendal_48d_puresky (CC0), LDR equirect (same HDRI as the Blender renders).
    new THREE.TextureLoader().load(BASE + (MOBILE ? 'sky_1k.jpg' : 'sky_2k.jpg'), (tex) => {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      scene.background = tex;
      scene.environment = tex;
      scene.environmentIntensity = 0.9;
    });

    scene.add(new THREE.HemisphereLight(0xdfeeff, 0x5d6b45, 0.35));
    const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.03;
    sun.shadow.radius = 3;
    scene.add(sun, sun.target);
    const SUN_DIR = new THREE.Vector3(0.55, 0.85, 0.75).normalize();   // same sun direction as the Blender renders

    // ---- low-poly vegetation (positions/heights from build_bestand_nr12_v2.py), instanced
    function buildTrees(list) {
      const toGl = (x, y) => new THREE.Vector3(x, 0, -y);   // Blender (x, y, z-up) -> glTF/three (x, z, -y)
      const cyl = new THREE.CylinderGeometry(1, 1, 1, 7); cyl.translate(0, 0.5, 0);
      const cone = new THREE.ConeGeometry(1, 1, 9);
      const ball = new THREE.IcosahedronGeometry(1, 2);
      const flat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, flatShading: true });
      const parts = { trunk: [], needle: [], leaf: [] };
      const m4 = (pos, scl, yaw = 0) => new THREE.Matrix4().compose(pos, new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw), scl);
      let seed = 12; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (const [k, x, y, h, r] of list) {
        const p = toGl(x, y), yaw = rnd() * Math.PI * 2, tone = 0.85 + rnd() * 0.3;
        const base = m4(p, new THREE.Vector3(1, 1, 1), yaw);
        const add = (key, pos, scl) => parts[key].push([base.clone().multiply(m4(pos, scl)), tone]);
        if (k === 'con') {
          const tr = Math.max(0.12, r * 0.09);
          add('trunk', new THREE.Vector3(0, 0, 0), new THREE.Vector3(tr, h * 0.25, tr));
          for (const [z0, z1, rr] of [[h * 0.12, h * 0.7, r], [h * 0.45, h, r * 0.62]])
            add('needle', new THREE.Vector3(0, (z0 + z1) / 2, 0), new THREE.Vector3(rr, z1 - z0, rr));
        } else {
          const tr = Math.max(0.14, r * 0.08);
          add('trunk', new THREE.Vector3(0, 0, 0), new THREE.Vector3(tr, h - r * 0.9, tr));
          for (const [dx, dy, dz, s] of [[0, 0, 0, 1], [r * 0.45, r * 0.2, -r * 0.25, 0.7], [-r * 0.4, -r * 0.3, -r * 0.2, 0.68]])
            add('leaf', new THREE.Vector3(dx, h - r + dz, -dy), new THREE.Vector3(r * s, r * s * 0.85, r * s));
        }
      }
      const group = new THREE.Group(); group.name = 'Vegetation'; group.userData.count = list.length;
      const defs = { trunk: [cyl, flat(0x5b4331)], needle: [cone, flat(0x2e4a2b)], leaf: [ball, flat(0x557d38)] };
      const c = new THREE.Color();
      for (const [key, [geo, mat]] of Object.entries(defs)) {
        const items = parts[key]; if (!items.length) continue;
        const im = new THREE.InstancedMesh(geo, mat, items.length);
        items.forEach(([m, t], i) => { im.setMatrixAt(i, m); im.setColorAt(i, c.setScalar(t)); });
        im.castShadow = true; im.receiveShadow = true;
        im.computeBoundingSphere();
        group.add(im);
      }
      return group;
    }

    // Glas: von beiden Seiten durchsichtig (vorher opak → von innen "blind").
    const fixGlass = (root) => root.traverse((o) => {
      if (!o.isMesh || !/glas/i.test(o.name + ' ' + (o.material && o.material.name))) return;
      const m = o.material.clone();
      m.transparent = true; m.opacity = 0.28; m.depthWrite = false; m.side = THREE.DoubleSide;
      m.color.setRGB(0.55, 0.68, 0.75); m.metalness = 0; m.roughness = 0.05;
      o.material = m; o.castShadow = false; o.renderOrder = 2;
    });

    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);
    const vegPromise = fetch(BASE + 'vegetation.json').then((r) => r.json()).catch((e) => { console.warn('vegetation.json', e); return { trees: [] }; });

    loader.load(BASE + (MOBILE ? 'bestand_nr12_v2_mobile.glb' : 'bestand_nr12_v2.glb'), async (gltf) => {
      const root = gltf.scene;
      fixGlass(root);
      // Fit to the buildings/plots, not to the large ground plane.
      const box = new THREE.Box3(), tmp = new THREE.Box3(), size = new THREE.Vector3();
      root.updateMatrixWorld(true);
      root.traverse((o) => {
        if (!o.isMesh) return;
        // The grass texture exports without Blender's green tint; restore it.
        if (o.material && o.material.name === 'grass') o.material.color.setRGB(0.62, 0.85, 0.45);
        tmp.setFromObject(o); tmp.getSize(size);
        const large = Math.max(size.x, size.z) > 120;
        o.castShadow = !large;
        o.receiveShadow = true;
        if (!large) box.union(tmp);
      });
      if (box.isEmpty()) box.setFromObject(root);
      scene.add(root);

      const vj = await vegPromise, all = vj.trees || [];
      // Plot-Frame 121/2 (bungalow/v1_layout.py): u entlang Grenze 121/1|121/2, v Richtung Am Osterfeld
      const PO = [-22.614073, 10.959574], PU = [0.786761, 0.617258], PV = [-0.617258, 0.786761], U0_V1 = 14.40, BU_W = 19.0, BU_V0 = 3.03, BU_D = 9.2;
      const toUV = (x, y) => [(x - PO[0]) * PU[0] + (y - PO[1]) * PU[1], (x - PO[0]) * PV[0] + (y - PO[1]) * PV[1]];
      let posU = U0_V1;
      const isFelled = (t) => {
        if (posU === U0_V1) return (vj.felled_v1 || []).some(([x, y]) => Math.abs(t[1] - x) < 0.05 && Math.abs(t[2] - y) < 0.05);
        const [u, v] = toUV(t[1], t[2]);   // andere Lage: Bäume im Baufeld (+1,5 m) und auf der Terrasse
        return u > posU - 1.5 && u < posU + BU_W + 1.5 && v > BU_V0 - 3.5 && v < BU_V0 + BU_D + 1.5;
      };
      let veg = buildTrees(all.filter((t) => !isFelled(t)));
      let vegFelled = buildTrees(all.filter(isFelled));
      scene.add(veg, vegFelled);
      veg.userData.count = all.length;
      const rebuildTrees = () => {
        const vis = vegFelled.visible; scene.remove(veg, vegFelled);
        veg = buildTrees(all.filter((t) => !isFelled(t))); vegFelled = buildTrees(all.filter(isFelled));
        vegFelled.visible = vis; scene.add(veg, vegFelled);
      };

      // ---- Luftbild LGLN DOP20 (dl-de/by-2-0), 240 x 240 m, EPSG:25832, per Flurstück 121/2 eingepasst (Abw. < 1 cm)
      const SAT = [[-159.934, 26.697], [-34.046, -174.112], [166.762, -48.223], [40.874, 152.585]];   // NW, NE, SE, SW (three x, z)
      const satGeo = new THREE.BufferGeometry();
      satGeo.setAttribute('position', new THREE.Float32BufferAttribute(SAT.flatMap(([x, z]) => [x, 0.006, z]), 3));
      satGeo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 1, 0, 0, 0], 2));
      satGeo.setIndex([0, 3, 1, 1, 3, 2]); satGeo.computeVertexNormals();
      const fade = document.createElement('canvas'); fade.width = fade.height = 128;
      { const g = fade.getContext('2d'), gr = g.createRadialGradient(64, 64, 40, 64, 64, 64); gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#000'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }
      const satMat = new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0, transparent: true, alphaMap: new THREE.CanvasTexture(fade), polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
      const satMesh = new THREE.Mesh(satGeo, satMat); satMesh.receiveShadow = true; satMesh.visible = false; satMesh.renderOrder = 1; scene.add(satMesh);
      const satBtn = document.getElementById('sat'), attr = document.getElementById('attr');
      let satLoaded = false;
      const setSat = (on) => {
        satBtn.classList.toggle('on', on); satBtn.setAttribute('aria-pressed', on);
        satBtn.textContent = on ? '✓ Luftbild' : 'Luftbild einblenden';
        attr.style.display = on ? 'block' : 'none';
        if (on && !satLoaded) {
          satLoaded = true; satBtn.textContent = 'Luftbild lädt …';
          new THREE.TextureLoader().load(BASE + (MOBILE ? 'luftbild_1k.jpg' : 'luftbild_2k.jpg'), (t) => {
            t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
            satMat.map = t; satMat.needsUpdate = true; satMesh.visible = satBtn.classList.contains('on');
            satBtn.textContent = satMesh.visible ? '✓ Luftbild' : 'Luftbild einblenden'; window.__satReady = true;
          });
        } else satMesh.visible = on && !!satMat.map;
      };
      // mobil: Quellenangabe direkt über der (ggf. zweizeiligen) Bildunterschrift
      const capEl = document.getElementById('caption');
      new ResizeObserver(() => { attr.style.bottom = window.innerWidth <= 640 ? (capEl.getBoundingClientRect().height + 18) + 'px' : ''; }).observe(capEl);
      satBtn.style.display = 'block';
      satBtn.addEventListener('click', () => setSat(!satBtn.classList.contains('on')));
      if (new URLSearchParams(location.search).has('luftbild')) setSat(true);
      const shadowBox = box.clone().union(new THREE.Box3().setFromObject(veg)).union(new THREE.Box3().setFromObject(vegFelled));

      const center = box.getCenter(new THREE.Vector3());
      const radius = box.getSize(new THREE.Vector3()).length() / 2;
      const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.7;
      camera.position.copy(center).add(new THREE.Vector3(0.6, 0.34, 0.85).normalize().multiplyScalar(dist));
      controls.target.copy(center);
      controls.maxDistance = dist * 3;
      controls.minDistance = 2;
      controls.update();

      const sc = shadowBox.getCenter(new THREE.Vector3());
      const sr = shadowBox.getSize(new THREE.Vector3()).length() / 2;
      sun.position.copy(sc).addScaledVector(SUN_DIR, sr * 2);
      sun.target.position.copy(sc);
      const s = sun.shadow.camera;
      s.left = s.bottom = -sr; s.right = s.top = sr;
      s.near = 0.5; s.far = sr * 4;
      s.updateProjectionMatrix();

      status.remove();
      window.__view = { camera, controls };   // für automatische Screenshots
      window.__viewerReady = { trees: veg.userData.count, instances: [veg, vegFelled].reduce((n, g) => n + g.children.reduce((k, m) => k + m.count, 0), 0), mobile: MOBILE };

      // ---- optional: Neubau Bungalow V1 auf Flst. 121/2 (Vorentwurf), lazy geladen
      const btn = document.getElementById('v1'), caption = document.getElementById('caption'), posBox = document.getElementById('pos');
      // Lage-Varianten: Bungalow (inkl. Terrasse/Stellplätze) entlang u verschieben – nur Ansicht
      const setPos = (u) => {
        posU = u; posBox.querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.dataset.u === u));
        const d = u - U0_V1; if (bungalow) bungalow.position.set(PU[0] * d, 0, -PU[1] * d);
        rebuildTrees(); if (bungalow) vegFelled.visible = !bungalow.visible;
      };
      posBox.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => setPos(+b.dataset.u)));
      let bungalow = null, loading = false;
      const setV1 = (on) => {
        btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on);
        const label = () => (btn.classList.contains('on') ? '✓ Neubau Bungalow V1' : 'Neubau Bungalow V1 einblenden');
        btn.textContent = label();
        vegFelled.visible = !on; posBox.style.display = on ? 'flex' : 'none';
        if (bungalow) bungalow.visible = on;
        caption.textContent = on ? 'Bestand Ashausener Str. 12 + Neubau Bungalow V1 (Vorentwurf)' : 'Bestand Ashausener Str. 12 – Modell v2';
        if (!bungalow && !loading) {   // immer laden: Straße Am Osterfeld steckt im Bungalow-GLB
          loading = true; if (on) btn.textContent = 'Bungalow V1 lädt …';
          loader.load(BASE + 'bungalow_v1.glb', (g) => {
            bungalow = g.scene;
            bungalow.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
            fixGlass(bungalow);
            // Straße/Gehweg Am Osterfeld gehören nicht zum Bungalow → dauerhaft sichtbar.
            bungalow.children.filter((o) => !/^BU_/.test(o.name)).forEach((o) => scene.attach(o));
            bungalow.visible = btn.classList.contains('on');
            { const d = posU - U0_V1; bungalow.position.set(PU[0] * d, 0, -PU[1] * d); }
            scene.add(bungalow); btn.textContent = label();
            window.__v1Ready = true;
          }, undefined, (e) => { console.error(e); btn.textContent = 'Bungalow V1 nicht verfügbar'; });
        }
      };
      btn.style.display = 'block';
      btn.addEventListener('click', () => setV1(!btn.classList.contains('on')));
      setV1(!new URLSearchParams(location.search).has('bestand'));
      { const q = new URLSearchParams(location.search).get('lage'); if (q) setPos({ mitte: 8.70, west: 3.03 }[q] || U0_V1); }   // Bungalow standardmäßig an; ?bestand = nur Bestand
    }, (ev) => {
      if (ev.total) status.textContent = `Modell wird geladen … ${Math.round(ev.loaded / ev.total * 100)} %`;
      else status.textContent = `Modell wird geladen … ${(ev.loaded / 1e6).toFixed(1)} MB`;
    }, (err) => {
      console.error(err);
      status.textContent = 'Modell konnte nicht geladen werden.';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
    // Paused by the parent page while the IFC view is shown (saves GPU/battery).
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data || !('active' in e.data)) return;
      renderer.setAnimationLoop(e.data.active ? () => { controls.update(); renderer.render(scene, camera); } : null);
    });
  </script>
</body>
</html>
