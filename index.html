<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mustergrundstück Oberhofer — Baukasten</title>
  <style>
    :root {
      --bg: #1a211c;
      --panel: rgba(18, 24, 20, 0.95);
      --ink: #eef4ee;
      --muted: #b7c4b8;
      --accent: #d4a017;
      --ok: #6f9f6a;
      --warn: #cc4444;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
    #canvas-wrap { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* TOP BAR - always visible */
    #topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      background: var(--panel);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 10px 16px 12px;
    }
    #topbar h1 {
      margin: 0 0 10px; font-size: 15px; font-weight: 600;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    #topbar h1 span { font-weight: 400; color: var(--muted); font-size: 12px; }
    
    .topbar-row {
      display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    }
    .topbar-group {
      display: flex; align-items: center; gap: 8px;
    }
    .topbar-label {
      font-size: 11px; font-weight: 600; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.05em;
      white-space: nowrap;
    }
    
    /* Variant buttons - large, high contrast */
    .variant-btn {
      appearance: none; border: 2px solid rgba(255,255,255,0.2);
      background: rgba(40, 50, 42, 0.9); color: #fff;
      font-weight: 700; font-size: 13px;
      padding: 10px 16px; border-radius: 6px;
      cursor: pointer; transition: all 0.15s;
      min-height: 42px;
    }
    .variant-btn:hover { background: rgba(60, 75, 62, 0.95); border-color: rgba(255,255,255,0.35); }
    .variant-btn.active {
      background: var(--accent); color: #1a1400;
      border-color: var(--accent);
    }
    
    /* Sun sliders - larger hit targets */
    .sun-control {
      display: flex; align-items: center; gap: 8px;
    }
    .sun-control label {
      font-size: 12px; color: var(--ink); min-width: 55px;
    }
    .sun-control input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100px; height: 24px; background: transparent;
      cursor: pointer;
    }
    .sun-control input[type="range"]::-webkit-slider-runnable-track {
      height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px;
    }
    .sun-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 20px; height: 20px; background: var(--accent);
      border-radius: 50%; margin-top: -6px; border: 2px solid #fff;
    }
    .sun-control input[type="range"]::-moz-range-track {
      height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px;
    }
    .sun-control input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px; background: var(--accent);
      border-radius: 50%; border: 2px solid #fff;
    }
    .sun-control .value {
      font-size: 13px; font-weight: 600; color: #fff;
      min-width: 50px; text-align: left;
    }
    
    /* Bottom panel - for less important controls */
    .ui {
      position: absolute; left: 16px; bottom: 16px; z-index: 6;
      background: var(--panel); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 12px 14px; width: min(280px, calc(100vw - 32px));
      backdrop-filter: blur(10px);
      max-height: calc(100vh - 160px);
      overflow-y: auto;
    }
    .ui h2 { margin: 0 0 8px; font-size: 11px; color: var(--accent); font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; }
    .section { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: var(--ok); color: #10210f; font-weight: 600;
      padding: 8px 12px; border-radius: 5px; font-size: 12px;
      transition: transform 0.1s, opacity 0.1s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    button.secondary { background: #3d4a40; color: var(--ink); }
    .form-row { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
    .form-row label { font-size: 11px; color: var(--muted); min-width: 55px; }
    .form-row input[type="text"], .form-row input[type="number"] {
      flex: 1; padding: 6px 8px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25); color: var(--ink); border-radius: 4px; font-size: 12px;
    }
    .form-row input::placeholder { color: var(--muted); opacity: 0.6; }
    #place-hint { font-size: 11px; color: var(--accent); margin-top: 6px; display: none; }
    .label {
      position: absolute; transform: translate(-50%, -100%);
      pointer-events: none; white-space: nowrap;
      font-size: 10px; font-weight: 600;
      background: rgba(14,18,15,0.85); color: #f3f7f2;
      padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.12);
    }
    #status { position: absolute; right: 16px; bottom: 16px; z-index: 6; font-size: 11px; color: var(--muted); text-align: right; }
    #sync-status { font-size: 10px; color: var(--muted); margin-top: 4px; }
    #sync-status.connected { color: var(--ok); }
    footer {
      position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
      font-size: 10px; color: rgba(255,255,255,0.35); z-index: 5;
    }
    #loading-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--muted);
      transition: opacity 0.3s;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    
    @media (max-width: 700px) {
      #topbar { padding: 8px 12px 10px; }
      #topbar h1 { font-size: 13px; margin-bottom: 8px; }
      .topbar-row { gap: 10px; }
      .variant-btn { padding: 8px 10px; font-size: 12px; min-height: 36px; }
      .sun-control input[type="range"] { width: 70px; }
      .sun-control label { min-width: 45px; font-size: 11px; }
      .ui { width: calc(100vw - 24px); left: 12px; bottom: 12px; max-height: calc(100vh - 140px); }
    }
  </style>
</head>
<body>

  <!-- TOP BAR: Variants + Sun - always visible -->
  <div id="topbar">

  <!-- BOTTOM PANEL: Object creation + View controls -->
  <div class="ui" id="panel">
    <div class="section">
      <h2>Neues Objekt</h2>
      <div class="form-row">
        <label>Name</label>
        <input type="text" id="new-name" placeholder="z.B. Carport">
      </div>
      <div class="form-row">
        <label>Breite (m)</label>
        <input type="number" id="new-width" placeholder="4" step="0.5" min="0.5">

      <div class="form-row">
        <label>Länge (m)</label>
        <input type="number" id="new-depth" placeholder="3" step="0.5" min="0.5">
      </div>
      <div class="form-row">
        <label>Höhe (m)</label>
        <input type="number" id="new-height" placeholder="2.5" step="0.5" min="0.5">
      </div>
      <button id="btn-create" type="button">Objekt anlegen</button>
      <div id="place-hint">Klicken Sie in die 3D-Ansicht zum Platzieren</div>
    </div>

    <div class="section">
      <h2>Ansicht</h2>
      <div class="row">
        <button id="btn-reset" type="button">Zurücksetzen</button>
        <button id="btn-top" class="secondary" type="button">Aufsicht</button>
        <button id="btn-iso" class="secondary" type="button">3D</button>
      </div>
      <div id="sync-status">nur lokal</div>
    </div>
  </div>
  
  <div id="status">Laden...</div>
  <footer>Baukasten entwickelt von Phillipp Zarindast</footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

    const wrap = document.getElementById("canvas-wrap");
    const statusEl = document.getElementById("status");
    const syncStatusEl = document.getElementById("sync-status");
    const loadingOverlay = document.getElementById("loading-overlay");

    function hideLoading() {
      loadingOverlay.classList.add("hidden");
    }

    const HAMBURG_LAT = 53.55;
    const HAMBURG_LON = 9.99;
    const MONTHS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Juni", "Juli", "Aug", "Sep", "Okt", "Nov", "Dez"];

    let kitData = null;
    let SITE_W = 40, SITE_D = 60, HALF_W, HALF_D;
    let PARK_X = 55, PARK_Z = 0, PARK_W = 30, PARK_D = 50;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8aa3b0);
    scene.fog = new THREE.Fog(0x8aa3b0, 100, 250);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
    camera.position.set(65, 50, 70);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);
    
    hideLoading();

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.domElement.style.position = "absolute";
    labelRenderer.domElement.style.top = "0";
    labelRenderer.domElement.style.left = "0";
    labelRenderer.domElement.style.pointerEvents = "none";
    wrap.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(20, 2, 0);
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 15;
    controls.maxDistance = 200;

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const sun = new THREE.DirectionalLight(0xfff3d4, 1.2);
    sun.position.set(50, 50, 25);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -80;
    sun.shadow.camera.right = 80;
    sun.shadow.camera.top = 60;
    sun.shadow.camera.bottom = -60;
    sun.shadow.bias = -0.0001;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0xb8d4e8, 0x4a5a3a, 0.25));

    let ydoc = null, yPositions = null, yCustomPieces = null, wsProvider = null;
    let isRemoteUpdate = false;
    let customPieceCounter = 0;
    let pendingPlacement = null;
    let syncReady = false;

    function initSyncLazy() {
      const connectTimeout = setTimeout(() => {
        if (!syncReady) {
          syncStatusEl.textContent = "nur lokal";
          syncStatusEl.classList.remove("connected");
        }
      }, 3000);

      Promise.all([
        import("https://cdn.jsdelivr.net/npm/yjs@13.6.10/+esm"),
        import("https://cdn.jsdelivr.net/npm/y-websocket@2.0.3/+esm")
      ]).then(([Y, YWebsocket]) => {
        ydoc = new Y.Doc();
        yPositions = ydoc.getMap("positions");
        yCustomPieces = ydoc.getMap("customPieces");
        
        try {
          wsProvider = new YWebsocket.WebsocketProvider(
            "wss://demos.yjs.dev",
            "muster-oberhofer-zarindast-2026",
            ydoc
          );
          wsProvider.on("status", (event) => {
            if (event.status === "connected") {
              clearTimeout(connectTimeout);
              syncReady = true;
              syncStatusEl.textContent = "verbunden";
              syncStatusEl.classList.add("connected");
            } else {
              syncStatusEl.textContent = "nur lokal";
              syncStatusEl.classList.remove("connected");
            }
          });
          wsProvider.on("sync", (isSynced) => {
            if (isSynced) {
              applyRemoteCustomPieces();
              applyRemotePositions();
            }
          });
          yPositions.observe(() => {
            if (!isRemoteUpdate) applyRemotePositions();
          });
          yCustomPieces.observe(() => {
            if (!isRemoteUpdate) applyRemoteCustomPieces();
          });
        } catch (e) {
          clearTimeout(connectTimeout);
          syncStatusEl.textContent = "nur lokal";
        }
      }).catch(() => {
        clearTimeout(connectTimeout);
        syncStatusEl.textContent = "nur lokal";
      });
    }

    function applyRemotePositions() {
      if (!yPositions) return;
      isRemoteUpdate = true;
      yPositions.forEach((pos, pieceId) => {
        const group = pieceGroups.get(pieceId);
        if (group && pos) {
          group.position.x = pos.x;
          group.position.z = pos.z;
          if (group.userData.isPV) {
            const roofY = findRoofHeight(pos.x, pos.z, group);
            group.position.y = roofY !== null ? roofY : 0;
          } else {
            group.position.y = pos.y || 0;
          }
        }
      });
      isRemoteUpdate = false;
    }

    function applyRemoteCustomPieces() {
      if (!yCustomPieces) return;
      isRemoteUpdate = true;
      yCustomPieces.forEach((pieceData, pieceId) => {
        if (!pieceGroups.has(pieceId)) {
          createCustomPieceFromData(pieceId, pieceData);
        }
      });
      isRemoteUpdate = false;
    }

    function createCustomPieceFromData(pieceId, data) {
      const { name, w, d, h, x, y, z, color } = data;
      const piece = {
        id: pieceId,
        name: name,
        label: `${name} ${w}×${d}×${h} m`,
        layer: "CUSTOM",
        type: "box",
        draggable: true,
        position: [x, z],
        size: [w, d, h],
        color: color || "#7a9f7a"
      };
      
      const g = new THREE.Group();
      g.name = pieceId;
      g.add(box(w, h, d, piece.color, 0, 0, 0, piece.name));
      if (h > 3) g.add(box(w + 0.2, 0.2, d + 0.2, darkenColor(piece.color, 0.7), 0, h, 0));
      g.position.set(x, y, z);
      registerKit(g, piece);
      
      const idNum = parseInt(pieceId.replace("custom_", ""), 10);
      if (!isNaN(idNum) && idNum >= customPieceCounter) {
        customPieceCounter = idNum + 1;
      }
    }

    function broadcastPosition(pieceId, x, y, z) {
      if (isRemoteUpdate || !yPositions) return;
      yPositions.set(pieceId, { x, y, z });
    }

    function mat(color, opts = {}) {
      return new THREE.MeshStandardMaterial({
        color, roughness: opts.roughness ?? 0.8, metalness: opts.metalness ?? 0.05,
        transparent: !!opts.opacity, opacity: opts.opacity ?? 1,
        side: opts.doubleSide ? THREE.DoubleSide : THREE.FrontSide
      });
    }

    function createBrickTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#b8856c';
      ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = '#a07560';
      for (let row = 0; row < 8; row++) {
        const offset = (row % 2) * 32;
        for (let col = 0; col < 4; col++) {
          const x = col * 64 + offset - 32;
          const y = row * 16;
          ctx.fillRect(x + 2, y + 2, 60, 12);
        }
      }
      ctx.strokeStyle = '#8a6550';
      ctx.lineWidth = 2;
      for (let row = 0; row <= 8; row++) {
        ctx.beginPath();
        ctx.moveTo(0, row * 16);
        ctx.lineTo(128, row * 16);
        ctx.stroke();
      }
      for (let row = 0; row < 8; row++) {
        const offset = (row % 2) * 32;
        for (let col = 0; col <= 4; col++) {
          ctx.beginPath();
          ctx.moveTo(col * 64 + offset - 32, row * 16);
          ctx.lineTo(col * 64 + offset - 32, (row + 1) * 16);
          ctx.stroke();
        }
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function matBrick(repeatX = 4, repeatY = 2) {
      const texture = createBrickTexture();
      texture.repeat.set(repeatX, repeatY);
      return new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.9,
        metalness: 0.0
      });
    }

    function matPlaster(color) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness: 0.95,
        metalness: 0.0
      });
    }

    function box(w, h, d, color, x, y, z, name, opacity) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, { opacity }));
      m.position.set(x, y + h / 2, z);
      m.castShadow = h > 0.5;
      m.receiveShadow = true;
      if (name) m.name = name;
      return m;
    }

    function boxWithMaterial(w, h, d, material, x, y, z, name) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      m.position.set(x, y + h / 2, z);
      m.castShadow = h > 0.5;
      m.receiveShadow = true;
      if (name) m.name = name;
      return m;
    }

    function createSaddleRoof(w, d, roofHeight, overhang, color) {
      const g = new THREE.Group();
      const halfW = w / 2 + overhang;
      const halfD = d / 2 + overhang;
      const shape = new THREE.Shape();
      shape.moveTo(-halfW, 0);
      shape.lineTo(0, roofHeight);
      shape.lineTo(halfW, 0);
      shape.lineTo(-halfW, 0);
      const extrudeSettings = { depth: d + overhang * 2, bevelEnabled: false };
      const roofGeom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      const roofMat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.1 });
      const roof = new THREE.Mesh(roofGeom, roofMat);
      roof.rotation.x = Math.PI / 2;
      roof.position.set(0, roofHeight, halfD);
      roof.castShadow = true;
      roof.receiveShadow = true;
      g.add(roof);
      return g;
    }

    function createWindow(w, h, frameColor, glassColor) {
      const g = new THREE.Group();
      const frameThickness = 0.05;
      const frameMat = mat(frameColor);
      const glassMat = new THREE.MeshStandardMaterial({ 
        color: glassColor, 
        roughness: 0.1, 
        metalness: 0.3,
        transparent: true,
        opacity: 0.6
      });
      const glass = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.1, h - 0.1), glassMat);
      glass.position.z = 0.02;
      g.add(glass);
      const frameTop = new THREE.Mesh(new THREE.BoxGeometry(w, frameThickness, 0.08), frameMat);
      frameTop.position.set(0, h/2 - frameThickness/2, 0);
      g.add(frameTop);
      const frameBottom = frameTop.clone();
      frameBottom.position.y = -h/2 + frameThickness/2;
      g.add(frameBottom);
      const frameLeft = new THREE.Mesh(new THREE.BoxGeometry(frameThickness, h, 0.08), frameMat);
      frameLeft.position.set(-w/2 + frameThickness/2, 0, 0);
      g.add(frameLeft);
      const frameRight = frameLeft.clone();
      frameRight.position.x = w/2 - frameThickness/2;
      g.add(frameRight);
      const frameMid = new THREE.Mesh(new THREE.BoxGeometry(frameThickness * 0.7, h - 0.1, 0.06), frameMat);
      g.add(frameMid);
      return g;
    }

    function createDoor(w, h, color, handleColor) {
      const g = new THREE.Group();
      const doorMat = mat(color, { roughness: 0.7 });
      const door = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), doorMat);
      g.add(door);
      const frameMat = mat(0x4a3a2a);
      const frameTop = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, 0.06, 0.1), frameMat);
      frameTop.position.set(0, h/2, 0);
      g.add(frameTop);
      const frameLeft = new THREE.Mesh(new THREE.BoxGeometry(0.06, h + 0.06, 0.1), frameMat);
      frameLeft.position.set(-w/2 - 0.03, 0, 0);
      g.add(frameLeft);
      const frameRight = frameLeft.clone();
      frameRight.position.x = w/2 + 0.03;
      g.add(frameRight);
      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.15, 0.05), mat(handleColor, { metalness: 0.8, roughness: 0.2 }));
      handle.position.set(w/2 - 0.15, 0, 0.06);
      g.add(handle);
      return g;
    }

    function createDetailedHouse(w, d, wallHeight, roofHeight, config = {}) {
      const g = new THREE.Group();
      const useBrick = config.brick !== false;
      const wallMat = useBrick ? matBrick(w/3, wallHeight/2) : matPlaster(config.wallColor || 0xf5f0e6);
      g.add(boxWithMaterial(w, wallHeight, d, wallMat, 0, 0, 0, config.name || "Haus"));
      if (roofHeight > 0) {
        const roof = createSaddleRoof(w, d, roofHeight, 0.4, config.roofColor || 0x8b4513);
        roof.position.y = wallHeight;
        g.add(roof);
      }
      if (config.windows) {
        for (const win of config.windows) {
          const window = createWindow(win.w || 1.2, win.h || 1.4, 0xffffff, 0x87ceeb);
          window.position.set(win.x, win.y, win.z);
          if (win.rotY) window.rotation.y = win.rotY;
          g.add(window);
        }
      }
      if (config.door) {
        const door = createDoor(config.door.w || 1.0, config.door.h || 2.2, 0x5a4a3a, 0xc0c0c0);
        door.position.set(config.door.x, config.door.y, config.door.z);
        if (config.door.rotY) door.rotation.y = config.door.rotY;
        g.add(door);
      }
      return g;
    }

    function cyl(r, h, color, x, y, z, name, segs = 28) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, segs), mat(color));
      m.position.set(x, y + h / 2, z);
      m.castShadow = true;
      m.receiveShadow = true;
      if (name) m.name = name;
      return m;
    }

    function polygon(vertices, height, color, opacity = 1) {
      const shape = new THREE.Shape();
      shape.moveTo(vertices[0][0], vertices[0][1]);
      for (let i = 1; i < vertices.length; i++) shape.lineTo(vertices[i][0], vertices[i][1]);
      shape.closePath();
      const geometry = height > 0 
        ? new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false })
        : new THREE.ShapeGeometry(shape);
      const mesh = new THREE.Mesh(geometry, mat(color, { opacity, doubleSide: true }));
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = height > 0 ? 0 : 0.02;
      mesh.receiveShadow = true;
      return mesh;
    }

    function makeLabel(text, y) {
      const el = document.createElement("div");
      el.className = "label";
      el.textContent = text;
      const obj = new CSS2DObject(el);
      obj.position.set(0, y, 0);
      return obj;
    }

    function treeMass(x, z, r, h, name) {
      const g = new THREE.Group();
      g.name = name;
      const trunk = cyl(r * 0.18, h * 0.3, 0x6b4f32, 0, 0, 0);
      const crown = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat(0x3f6b3a, { roughness: 0.9 }));
      crown.position.set(0, h * 0.55, 0);
      crown.scale.set(1, 0.9, 1);
      crown.castShadow = true;
      g.add(trunk, crown);
      g.position.set(x, 0, z);
      return g;
    }

    const context = new THREE.Group();
    context.name = "Kontext_fest";
    scene.add(context);

    const kit = new THREE.Group();
    kit.name = "Baukasten_verschiebbar";
    scene.add(kit);

    const draggables = [];
    const home = new Map();
    const pieceGroups = new Map();
    const variantIds = {
      bungalow: "option_bungalow",
      efh: "option_efh", 
      mfh: "option_mfh",
      ersatz: "option_ersatz"
    };
    const variantParkedPos = {
      bungalow: { x: 55, z: 18 },
      efh: { x: 72, z: 18 },
      mfh: { x: 55, z: 0 },
      ersatz: { x: 55, z: -18 }
    };

    function registerKit(group, piece) {
      group.userData.draggable = true;
      group.userData.pieceId = piece.id;
      group.userData.isPV = piece.isPV || false;
      group.userData.pieceHeight = piece.type === 'box' ? piece.size[2] : (piece.height || 0.5);
      if (piece.label) {
        const labelY = piece.type === 'box' ? (piece.size[2] + 0.8) : (piece.height + 0.6);
        group.add(makeLabel(piece.label, labelY));
      }
      kit.add(group);
      draggables.push(group);
      home.set(group, group.position.clone());
      pieceGroups.set(piece.id, group);
    }

    function buildScene(data) {
      kitData = data;
      SITE_W = data.site.width;
      SITE_D = data.site.depth;
      HALF_W = SITE_W / 2;
      HALF_D = SITE_D / 2;

      if (data.parkplatz && data.parkplatz.enabled) {
        PARK_X = data.parkplatz.position[0];
        PARK_Z = data.parkplatz.position[1];
        PARK_W = data.parkplatz.size[0];
        PARK_D = data.parkplatz.size[1];
      }

      const lawn = new THREE.Mesh(new THREE.PlaneGeometry(SITE_W, SITE_D), mat(0x6b8f4e, { roughness: 0.95 }));
      lawn.rotation.x = -Math.PI / 2;
      lawn.receiveShadow = true;
      lawn.name = "Rasen";
      context.add(lawn);

      const groundRing = new THREE.Mesh(new THREE.PlaneGeometry(SITE_W + 80, SITE_D + 50), mat(0x8a8a7a, { roughness: 1 }));
      groundRing.rotation.x = -Math.PI / 2;
      groundRing.position.set(20, -0.03, 0);
      groundRing.receiveShadow = true;
      groundRing.name = "Umgebung";
      context.add(groundRing);

      const edge = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.PlaneGeometry(SITE_W, SITE_D)),
        new THREE.LineBasicMaterial({ color: 0x2f4a28 })
      );
      edge.rotation.x = -Math.PI / 2;
      edge.position.y = 0.04;
      context.add(edge);

      if (data.parkplatz && data.parkplatz.enabled) addParkplatz(data.parkplatz);
      addFence();
      addNorthArrow();

      for (const piece of data.pieces) buildPiece(piece, data.layers);
    }

    function buildPiece(piece, layers) {
      const layerDef = layers[piece.layer] || {};
      const color = piece.color || layerDef.color || "#888888";

      if (piece.layer === "ABSTAND" || piece.layer === "STRASSE" || piece.layer === "LAERMSTREIFEN") {
        return;
      }

      if (piece.type === "polygon" && !piece.draggable) {
        const verts = piece.vertices;
        const offsetVerts = piece.position ? verts.map(v => [v[0] + piece.position[0], v[1] + piece.position[1]]) : verts;
        
        if (piece.layer === "BAUFENSTER") {
          const lineVerts = [...offsetVerts, offsetVerts[0]];
          const lineGeom = new THREE.BufferGeometry().setFromPoints(lineVerts.map(v => new THREE.Vector3(v[0], 0.08, v[1])));
          const baufensterLine = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0xd4a017, linewidth: 2 }));
          baufensterLine.name = piece.name;
          context.add(baufensterLine);
          
          if (piece.label) {
            const centroid = offsetVerts.reduce((acc, v) => [acc[0] + v[0], acc[1] + v[1]], [0, 0]);
            centroid[0] /= offsetVerts.length;
            centroid[1] /= offsetVerts.length;
            const labelGroup = new THREE.Group();
            labelGroup.position.set(centroid[0], 0, centroid[1]);
            labelGroup.add(makeLabel(piece.label, 0.5));
            context.add(labelGroup);
          }
          return;
        }
        
        if (piece.layer === "SITE_BOUNDARY") {
          const lineVerts = [...offsetVerts, offsetVerts[0]];
          const lineGeom = new THREE.BufferGeometry().setFromPoints(lineVerts.map(v => new THREE.Vector3(v[0], 0.04, v[1])));
          context.add(new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color })));
          return;
        }
        
        const mesh = polygon(offsetVerts, piece.height || 0, color, piece.fillOpacity || 0.6);
        mesh.name = piece.name;
        context.add(mesh);
        const lineVerts = [...offsetVerts, offsetVerts[0]];
        const lineGeom = new THREE.BufferGeometry().setFromPoints(lineVerts.map(v => new THREE.Vector3(v[0], piece.height + 0.05, v[1])));
        context.add(new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color })));
      }
      else if (piece.type === "box") {
        const g = new THREE.Group();
        g.name = piece.id;
        const [w, d, h] = piece.size;
        
        if (piece.detailed) {
          const detailedHouse = createDetailedHouse(w, d, piece.wallHeight || h, piece.roofHeight || 0, {
            name: piece.name,
            brick: piece.brick,
            wallColor: piece.wallColor,
            roofColor: piece.roofColor,
            windows: piece.windows,
            door: piece.door
          });
          g.add(detailedHouse);
        } else {
          g.add(box(w, h, d, color, 0, 0, 0, piece.name));
          if (h > 3) g.add(box(w + 0.2, 0.2, d + 0.2, darkenColor(color, 0.7), 0, h, 0));
        }
        g.position.set(piece.position[0], 0, piece.position[1]);
        if (piece.draggable) registerKit(g, piece);
        else context.add(g);
      }
      else if (piece.type === "cylinder") {
        const g = new THREE.Group();
        g.name = piece.id;
        g.add(cyl(piece.radius, piece.height, color, 0, 0, 0, piece.name));
        g.add(cyl(piece.radius + 0.05, 0.1, darkenColor(color, 0.8), 0, piece.height, 0, null, 28));
        g.position.set(piece.position[0], 0, piece.position[1]);
        if (piece.draggable) registerKit(g, piece);
        else context.add(g);
      }
      else if (piece.type === "tree") {
        context.add(treeMass(piece.position[0], piece.position[1], piece.radius, piece.height, piece.name));
      }
      else if (piece.type === "polygon" && piece.draggable) {
        const g = new THREE.Group();
        g.name = piece.id;
        g.add(polygon(piece.vertices, piece.height || 0.3, color, 0.8));
        g.position.set(piece.position[0], 0, piece.position[1]);
        registerKit(g, piece);
      }
    }

    function darkenColor(hex, factor) {
      const c = new THREE.Color(hex);
      c.multiplyScalar(factor);
      return c;
    }

    function addFence() {
      const fenceGroup = new THREE.Group();
      fenceGroup.name = "Zaun";
      const postMat = mat(0x5a4632);
      const railMat = mat(0x6a5340);
      function addFenceRun(ax, az, bx, bz) {
        const dx = bx - ax, dz = bz - az;
        const len = Math.hypot(dx, dz);
        const n = Math.max(2, Math.round(len / 4));
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          const p = cyl(0.07, 1.1, 0x5a4632, ax + dx * t, 0, az + dz * t);
          p.material = postMat;
          fenceGroup.add(p);
        }
        const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.05, 0.05), railMat);
        rail.position.set((ax + bx) / 2, 0.9, (az + bz) / 2);
        rail.rotation.y = Math.atan2(dx, dz) + Math.PI / 2;
        rail.castShadow = true;
        fenceGroup.add(rail);
        const rail2 = rail.clone();
        rail2.position.y = 0.5;
        fenceGroup.add(rail2);
      }
      addFenceRun(-HALF_W, -HALF_D, HALF_W, -HALF_D);
      addFenceRun(HALF_W, -HALF_D, HALF_W, HALF_D);
      addFenceRun(HALF_W, HALF_D, -HALF_W, HALF_D);
      addFenceRun(-HALF_W, HALF_D, -HALF_W, -HALF_D);
      context.add(fenceGroup);
    }

    function addNorthArrow() {
      const north = new THREE.Group();
      north.name = "Nordpfeil";
      const shaft = box(0.3, 0.1, 4, 0x222222, 0, 0.1, 0);
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.3, 8), mat(0xc0392b));
      head.rotation.x = -Math.PI / 2;
      head.position.set(0, 0.15, 2.5);
      north.add(shaft, head);
      north.position.set(17, 0, HALF_D - 3);
      north.add(makeLabel("N", 1.2));
      context.add(north);
    }

    function addParkplatz(parkConfig) {
      const parkGroup = new THREE.Group();
      parkGroup.name = "Parkplatz";
      const parkMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(parkConfig.size[0], parkConfig.size[1]),
        mat(0x5a5a5a, { roughness: 0.95 })
      );
      parkMesh.rotation.x = -Math.PI / 2;
      parkMesh.position.set(parkConfig.position[0], 0.01, parkConfig.position[1]);
      parkMesh.receiveShadow = true;
      parkMesh.name = "Parkplatz_Fläche";
      parkGroup.add(parkMesh);
      
      const pw = parkConfig.size[0], pd = parkConfig.size[1];
      const px = parkConfig.position[0], pz = parkConfig.position[1];
      const parkEdge = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.PlaneGeometry(pw, pd)),
        new THREE.LineBasicMaterial({ color: 0x3a3a3a })
      );
      parkEdge.rotation.x = -Math.PI / 2;
      parkEdge.position.set(px, 0.05, pz);
      parkGroup.add(parkEdge);
      
      parkGroup.add(makeLabel("Parkplatz", 0.6));
      parkGroup.children[parkGroup.children.length - 1].position.set(px, 0.6, pz - pd/2 + 2);
      context.add(parkGroup);
    }

    const raycaster = new THREE.Raycaster();
    const roofRaycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const hit = new THREE.Vector3();
    let dragging = null;
    let offset = new THREE.Vector3();

    function findRoofHeight(x, z, excludeGroup) {
      roofRaycaster.set(new THREE.Vector3(x, 50, z), new THREE.Vector3(0, -1, 0));
      const candidates = [...context.children, ...kit.children].filter(obj => obj !== excludeGroup);
      const hits = roofRaycaster.intersectObjects(candidates, true);
      for (const h of hits) {
        if (h.object.name === "Rasen" || h.object.name === "Umgebung" || h.object.name === "Parkplatz_Fläche") continue;
        let parent = h.object;
        while (parent && parent !== excludeGroup) {
          if (parent.userData.draggable && parent === excludeGroup) break;
          parent = parent.parent;
        }
        if (parent === excludeGroup) continue;
        if (h.point.y > 0.1) return h.point.y;
      }
      return null;
    }

    function ndc(ev) {
      const r = renderer.domElement.getBoundingClientRect();
      pointer.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
      pointer.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
    }

    function pick(ev) {
      ndc(ev);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(draggables, true);
      if (!hits.length) return null;
      let obj = hits[0].object;
      while (obj && !obj.userData.draggable) obj = obj.parent;
      return obj;
    }

    function clampToBounds(v, isPV = false, excludeGroup = null) {
      const inSite = v.x >= -HALF_W && v.x <= HALF_W && v.z >= -HALF_D && v.z <= HALF_D;
      const parkLeft = PARK_X - PARK_W / 2;
      const parkRight = PARK_X + PARK_W / 2;
      const parkTop = PARK_Z + PARK_D / 2;
      const parkBottom = PARK_Z - PARK_D / 2;
      const inPark = v.x >= parkLeft && v.x <= parkRight && v.z >= parkBottom && v.z <= parkTop;
      
      if (!inSite && !inPark) {
        const distToSite = Math.max(Math.abs(v.x) - HALF_W, Math.abs(v.z) - HALF_D);
        const distToPark = Math.max(Math.max(parkLeft - v.x, v.x - parkRight), Math.max(parkBottom - v.z, v.z - parkTop));
        if (distToSite < distToPark) {
          v.x = THREE.MathUtils.clamp(v.x, -HALF_W + 2, HALF_W - 2);
          v.z = THREE.MathUtils.clamp(v.z, -HALF_D + 2, HALF_D - 2);
        } else {
          v.x = THREE.MathUtils.clamp(v.x, parkLeft + 2, parkRight - 2);
          v.z = THREE.MathUtils.clamp(v.z, parkBottom + 2, parkTop - 2);
        }
      }
      
      if (isPV) {
        const roofY = findRoofHeight(v.x, v.z, excludeGroup);
        v.y = roofY !== null ? roofY : 0;
      } else {
        v.y = 0;
      }
      return v;
    }

    renderer.domElement.addEventListener("pointerdown", (ev) => {
      if (ev.button !== 0) return;
      
      if (pendingPlacement) {
        placePendingObject(ev);
        return;
      }
      
      const obj = pick(ev);
      if (!obj) return;
      ndc(ev);
      raycaster.setFromCamera(pointer, camera);
      if (!raycaster.ray.intersectPlane(groundPlane, hit)) return;
      dragging = obj;
      offset.set(obj.position.x - hit.x, 0, obj.position.z - hit.z);
      controls.enabled = false;
      statusEl.textContent = "Verschieben: " + (obj.name || "Teil");
    });

    renderer.domElement.addEventListener("pointermove", (ev) => {
      if (!dragging) return;
      ndc(ev);
      raycaster.setFromCamera(pointer, camera);
      if (!raycaster.ray.intersectPlane(groundPlane, hit)) return;
      const isPV = dragging.userData.isPV || false;
      dragging.position.copy(clampToBounds(hit.add(offset), isPV, dragging));
    });

    function endDrag() {
      if (!dragging) return;
      const pieceId = dragging.userData.pieceId;
      if (pieceId) {
        broadcastPosition(pieceId, dragging.position.x, dragging.position.y, dragging.position.z);
      }
      dragging = null;
      controls.enabled = true;
      statusEl.textContent = "Bereit";
    }
    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointerleave", endDrag);

    function resetKit() {
      for (const g of draggables) {
        const p = home.get(g);
        g.position.copy(p);
        const pieceId = g.userData.pieceId;
        if (pieceId) broadcastPosition(pieceId, p.x, p.y, p.z);
      }
      statusEl.textContent = "Zurückgesetzt";
    }

    function selectVariant(variantKey) {
      document.querySelectorAll(".variant-btn").forEach(btn => btn.classList.remove("active"));
      const activeBtn = document.querySelector(`[data-variant="${variantKey}"]`);
      if (activeBtn) activeBtn.classList.add("active");

      const baufensterCenter = { x: 6, z: 14 };

      for (const [vk, vId] of Object.entries(variantIds)) {
        const group = pieceGroups.get(vId);
        if (!group) continue;
        if (vk === variantKey) {
          group.position.set(baufensterCenter.x, 0, baufensterCenter.z);
        } else {
          const parkedPos = variantParkedPos[vk];
          if (parkedPos) {
            group.position.set(parkedPos.x, 0, parkedPos.z);
          }
        }
        broadcastPosition(vId, group.position.x, group.position.y, group.position.z);
      }
    }

    document.querySelectorAll(".variant-btn").forEach(btn => {
      btn.addEventListener("click", () => selectVariant(btn.dataset.variant));
    });

    const placeHint = document.getElementById("place-hint");
    
    document.getElementById("btn-create").addEventListener("click", () => {
      const nameInput = document.getElementById("new-name");
      const widthInput = document.getElementById("new-width");
      const depthInput = document.getElementById("new-depth");
      const heightInput = document.getElementById("new-height");
      
      const name = nameInput.value.trim() || "Objekt";
      const w = parseFloat(widthInput.value) || 4;
      const d = parseFloat(depthInput.value) || 3;
      const h = parseFloat(heightInput.value) || 2.5;
      
      pendingPlacement = { name, w, d, h };
      placeHint.style.display = "block";
      statusEl.textContent = "Platzierung: Klicken Sie auf die gewünschte Stelle";
      renderer.domElement.style.cursor = "crosshair";
    });

    function placePendingObject(ev) {
      if (!pendingPlacement) return;
      
      ndc(ev);
      raycaster.setFromCamera(pointer, camera);
      
      const allMeshes = [...context.children, ...kit.children];
      const hits = raycaster.intersectObjects(allMeshes, true);
      
      let placeX = 0, placeY = 0, placeZ = 0;
      let foundHit = false;
      
      for (const h of hits) {
        const objName = h.object.name;
        if (objName === "Rasen" || objName === "Umgebung" || objName === "Parkplatz_Fläche" || 
            objName === "Baufenster" || h.object.geometry instanceof THREE.PlaneGeometry) {
          placeX = h.point.x;
          placeZ = h.point.z;
          placeY = 0;
          foundHit = true;
          break;
        } else {
          placeX = h.point.x;
          placeZ = h.point.z;
          placeY = h.point.y;
          foundHit = true;
          break;
        }
      }
      
      if (!foundHit) {
        if (raycaster.ray.intersectPlane(groundPlane, hit)) {
          placeX = hit.x;
          placeZ = hit.z;
          placeY = 0;
        } else {
          return;
        }
      }
      
      const pieceId = "custom_" + customPieceCounter++;
      const { name, w, d, h } = pendingPlacement;
      const color = "#7a9f7a";
      
      const pieceData = { name, w, d, h, x: placeX, y: placeY, z: placeZ, color };
      
      createCustomPieceFromData(pieceId, pieceData);
      
      if (yCustomPieces) yCustomPieces.set(pieceId, pieceData);
      broadcastPosition(pieceId, placeX, placeY, placeZ);
      
      pendingPlacement = null;
      placeHint.style.display = "none";
      renderer.domElement.style.cursor = "default";
      statusEl.textContent = `${name} platziert`;
      
      document.getElementById("new-name").value = "";
      document.getElementById("new-width").value = "";
      document.getElementById("new-depth").value = "";
      document.getElementById("new-height").value = "";
    }

    document.getElementById("btn-reset").addEventListener("click", resetKit);
    document.getElementById("btn-top").addEventListener("click", () => {
      camera.position.set(20, 100, 0.01);
      controls.target.set(20, 0, 0);
      controls.update();
    });
    document.getElementById("btn-iso").addEventListener("click", () => {
      camera.position.set(65, 50, 70);
      controls.target.set(20, 2, 0);
      controls.update();
    });

    let suncalcLoaded = false;
    function updateSun() {
      if (!suncalcLoaded || typeof SunCalc === "undefined") {
        sun.position.set(50, 50, 25);
        return;
      }
      const hourSlider = document.getElementById("sun-hour");
      const monthSlider = document.getElementById("sun-month");
      const hour = parseFloat(hourSlider.value);
      const month = parseInt(monthSlider.value);
      
      const h = Math.floor(hour);
      const m = Math.round((hour - h) * 60);
      document.getElementById("sun-hour-val").textContent = `${h}:${m.toString().padStart(2, '0')}`;
      document.getElementById("sun-month-val").textContent = MONTHS[month - 1];

      const date = new Date(2026, month - 1, 21, h, m);
      const sunPos = SunCalc.getPosition(date, HAMBURG_LAT, HAMBURG_LON);
      
      const altitude = sunPos.altitude;
      const azimuth = sunPos.azimuth;
      
      if (altitude > 0) {
        const dist = 60;
        const x = dist * Math.sin(azimuth) * Math.cos(altitude);
        const y = dist * Math.sin(altitude);
        const z = dist * Math.cos(azimuth) * Math.cos(altitude);
        sun.position.set(x, Math.max(y, 5), z);
        sun.intensity = 0.8 + 0.4 * Math.sin(altitude);
        sun.castShadow = true;
      } else {
        sun.position.set(0, 5, 0);
        sun.intensity = 0.3;
        sun.castShadow = false;
      }
    }

    document.getElementById("sun-hour").addEventListener("input", updateSun);
    document.getElementById("sun-month").addEventListener("input", updateSun);

    function loadSunCalc() {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js";
      script.onload = () => {
        suncalcLoaded = true;
        updateSun();
      };
      script.onerror = () => {
        console.warn("SunCalc failed to load, using default sun position");
      };
      document.head.appendChild(script);
    }

    function resize() {
      const w = wrap.clientWidth, h = wrap.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      labelRenderer.setSize(w, h);
    }
    window.addEventListener("resize", resize);
    resize();

    function tick() {
      requestAnimationFrame(tick);
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    function init() {
      const dataEl = document.getElementById("kit-data");
      const data = JSON.parse(dataEl.textContent);
      buildScene(data);
      
      selectVariant("efh");
      
      statusEl.textContent = "Bereit";
      
      tick();
      
      loadSunCalc();
      initSyncLazy();
    }

    init();
  </script>
</body>
</html>
