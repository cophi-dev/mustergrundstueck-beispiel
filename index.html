<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashausener Str. 12, Stelle — Baukasten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #141a16;
      --panel: rgba(14, 18, 15, 0.72);
      --ink: #f3f6f2;
      --muted: #9aa89b;
      --accent: #d4a017;
      --ok: #6f9f6a;
      --warn: #cc4444;
      --glass: rgba(16, 20, 17, 0.58);
      --line: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16181a; color: var(--ink); font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    #canvas-wrap { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    #topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: linear-gradient(180deg, rgba(10,13,11,0.62) 0%, rgba(10,13,11,0.18) 70%, rgba(10,13,11,0) 100%);
      padding: 12px 14px 18px;
    }
    .brand, .chip, .sat-toggle, .sun-card {
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .brand { min-width: 168px; padding: 8px 12px; border-radius: 12px; }
    .brand h1 {
      margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
    }
    .brand p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
    .chip.variants {
      display: flex; align-items: center; gap: 2px;
      padding: 3px 3px 3px 10px; border-radius: 12px;
    }
    .chip.variants .v-label {
      font-size: 10px; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.06em; padding-right: 6px;
    }
    .variant-btn {
      appearance: none; border: 0;
      background: transparent; color: #e8eee8;
      font-family: inherit; font-weight: 500; font-size: 12px;
      padding: 7px 11px; border-radius: 9px;
      cursor: pointer; min-height: 32px;
    }
    .variant-btn:hover { background: rgba(255,255,255,0.08); }
    .variant-btn.active {
      background: var(--accent); color: #1a1400; font-weight: 600;
    }
    .topbar-right {
      display: flex; align-items: center; gap: 8px; margin-left: auto;
      padding: 4px 56px 4px 4px; border-radius: 14px;
    }
    .sat-toggle {
      appearance: none; color: var(--ink);
      font-family: inherit; font-weight: 600; font-size: 12px;
      padding: 8px 12px; border-radius: 12px;
      cursor: pointer; min-height: 38px;
    }
    .sat-toggle:hover { border-color: rgba(255,255,255,0.28); }
    .sat-toggle.active {
      background: var(--accent); color: #1a1400; border-color: var(--accent);
    }
    .sun-card {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px 6px 12px; border-radius: 12px;
    }
    .sun-card .sun-label {
      font-size: 10px; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .sun-control { display: flex; align-items: center; gap: 6px; }
    .sun-control input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 72px; height: 18px; background: transparent; cursor: pointer;
    }
    .sun-control input[type="range"]::-webkit-slider-runnable-track {
      height: 4px; background: rgba(255,255,255,0.18); border-radius: 4px;
    }
    .sun-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; background: var(--accent);
      border-radius: 50%; margin-top: -5px; border: 1px solid #fff;
    }
    .sun-control input[type="range"]::-moz-range-track {
      height: 4px; background: rgba(255,255,255,0.18); border-radius: 4px;
    }
    .sun-control input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; background: var(--accent);
      border-radius: 50%; border: 1px solid #fff;
    }
    .sun-control .value { font-size: 11px; font-weight: 600; color: #fff; min-width: 36px; }

    .ui {
      position: absolute; left: 12px; bottom: 12px; z-index: 6;
      background: var(--glass); border: 1px solid var(--line);
      border-radius: 14px; padding: 10px 12px; width: min(228px, calc(100vw - 24px));
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .ui h2 { margin: 0 0 8px; font-size: 10px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .section { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: var(--ok); color: #10210f; font-weight: 600;
      padding: 6px 10px; border-radius: 5px; font-size: 11px;
    }
    button:hover { opacity: 0.92; }
    button.secondary { background: #3d4a40; color: var(--ink); }
    button.secondary.active { background: var(--accent); color: #1a1400; }
    details.fold { margin-top: 2px; }
    details.fold summary {
      cursor: pointer; font-size: 11px; color: var(--muted); font-weight: 600;
      list-style: none;
    }
    details.fold summary::-webkit-details-marker { display: none; }
    details.fold summary::after { content: " ▾"; color: var(--accent); }
    .form-row { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
    .form-row label { font-size: 11px; color: var(--muted); min-width: 52px; }
    .form-row input[type="text"], .form-row input[type="number"] {
      flex: 1; padding: 5px 7px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25); color: var(--ink); border-radius: 4px; font-size: 12px;
    }
    #place-hint { font-size: 11px; color: var(--accent); margin-top: 6px; display: none; }
    .label {
      position: absolute; transform: translate(-50%, -100%);
      pointer-events: none; white-space: nowrap;
      font-size: 10px; font-weight: 600;
      background: rgba(14,18,15,0.72); color: #f3f7f2;
      padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.1);
    }
    .label.pin {
      background: var(--accent); color: #1a1400; border: none; font-size: 12px;
    }
    body.iso-view .label:not(.pin) { display: none !important; }
    #status { position: absolute; right: 14px; bottom: 28px; z-index: 6; font-size: 10px; color: rgba(255,255,255,0.42); text-align: right; max-width: min(360px, calc(100vw - 260px)); }
    #sync-status { display: none; }
    .area-fact { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; font-size: 11px; line-height: 1.3; }
    .area-fact strong { font-size: 13px; min-width: 50px; color: #fff; }
    .area-fact span { color: var(--muted); }
    .area-fact.main strong { color: var(--accent); }
    footer {
      position: absolute; bottom: 6px; right: 14px;
      font-size: 9px; color: rgba(255,255,255,0.28); z-index: 5;
    }
    #loading-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--muted);
      transition: opacity 0.3s;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    #compass {
      appearance: none; border: 0; padding: 0; margin: 0;
      width: 48px; height: 48px; cursor: pointer;
      background: transparent;
      position: fixed; top: 14px; right: 16px; z-index: 30;
    }
    #compass::before {
      content: "";
      position: absolute;
      inset: -12px;
    }
    #compass-rose {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--glass); border: 1px solid var(--line);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      position: relative; transform-origin: 50% 50%;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    #compass:hover #compass-rose { border-color: rgba(255,255,255,0.32); }
    #compass.tilted #compass-rose {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(212,160,23,0.28);
    }
    #compass-rose .n {
      position: absolute; top: 2px; left: 0; right: 0; text-align: center;
      color: #e74c3c; font-weight: 800; font-size: 11px;
    }
    #compass-rose .needle {
      position: absolute; left: 50%; top: 13px; width: 0; height: 0;
      margin-left: -4px;
      border-left: 4px solid transparent; border-right: 4px solid transparent;
      border-bottom: 13px solid #e74c3c;
    }
    #compass-rose .o, #compass-rose .w, #compass-rose .s {
      position: absolute; font-size: 9px; font-weight: 700; color: #d8ddd8;
    }
    #compass-rose .o, #compass-rose .w { top: 18px; }
    #compass-rose .o { right: 5px; }
    #compass-rose .w { left: 5px; }
    #compass-rose .s { bottom: 2px; left: 0; right: 0; text-align: center; }

    @media (max-width: 820px) {
      #topbar { padding: 8px 10px 14px; gap: 8px; }
      .brand h1 { font-size: 13px; }
      .chip.variants .v-label { display: none; }
      .sun-control input[type="range"] { width: 56px; }
      .ui { width: min(220px, calc(100vw - 24px)); }
      #status { max-width: calc(100vw - 24px); }
    }
  </style>
</head>

  <div id="loading-overlay">Laden…</div>
  <div id="canvas-wrap"></div>
  <div id="topbar">
    <div class="brand">
      <h1>Ashausener Str. 12</h1>
      <p>Stelle · Flst. 121/2 · 702 m²</p>
    </div>
    <div class="chip variants" role="group" aria-label="Variante">
      <span class="v-label">Variante</span>
      <button class="variant-btn" data-variant="bungalow" type="button">Bungalow</button>
      <button class="variant-btn" data-variant="efh" type="button">EFH</button>
      <button class="variant-btn" data-variant="doppelhaus" type="button">Doppelhaus</button>
      <button class="variant-btn" data-variant="ersatz" type="button">Ersatz</button>
    </div>
    <div class="topbar-right">
      <button id="btn-sat" class="sat-toggle" type="button">Satellit</button>
      <div class="sun-card">
        <span class="sun-label">Sonne</span>
        <div class="sun-control">
          <input type="range" id="sun-hour" min="5" max="21" step="0.5" value="12">
          <span class="value" id="sun-hour-val">12:00</span>
        </div>
        <div class="sun-control">
          <input type="range" id="sun-month" min="1" max="12" step="1" value="6">
          <span class="value" id="sun-month-val">Juni</span>
        </div>
      </div>
    </div>
  </div>
  <button id="compass" type="button" title="Zurück zur Aufsicht" aria-label="Zurück zur Aufsicht">
    <div id="compass-rose"><div class="needle"></div><div class="n">N</div><div class="o">O</div><div class="s">S</div><div class="w">W</div></div>
  </button>

  <div class="ui" id="panel">
    <div class="section">
      <h2>Flächen 121/2</h2>
      <div class="area-fact main"><strong>702 m²</strong><span>Grundstück (ALKIS)</span></div>
      <div class="area-fact"><strong>293 m²</strong><span>Baugrenze (7 / 3 / 3 m)</span></div>
      <div class="area-fact"><strong>176 m²</strong><span>max. GR nach GRZ 0,25</span></div>
    </div>
    <div class="section">
      <div class="row">
        <button id="btn-extra-pv" class="secondary" type="button">PV</button>
        <button id="btn-extra-zisterne" class="secondary" type="button">Zisterne</button>
        <button id="btn-extra-gruen" class="secondary" type="button">Grün</button>
        <button id="btn-trees" class="secondary active" type="button">Bäume</button>
        <button id="btn-reset" type="button">Reset</button>
      </div>
    </div>
    <div class="section">
      <details class="fold">
        <summary>Neues Objekt</summary>
        <div class="form-row">
          <label>Name</label>
          <input type="text" id="new-name" placeholder="z.B. Carport">
        </div>
        <div class="form-row">
          <label>Breite</label>
          <input type="number" id="new-width" placeholder="4" step="0.5" min="0.5">
        </div>
        <div class="form-row">
          <label>Länge</label>
          <input type="number" id="new-depth" placeholder="3" step="0.5" min="0.5">
        </div>
        <div class="form-row">
          <label>Höhe</label>
          <input type="number" id="new-height" placeholder="2.5" step="0.5" min="0.5">
        </div>
        <button id="btn-create" type="button">Platzieren</button>
        <div id="place-hint">In die Karte klicken</div>
      </details>
    </div>
    <div id="sync-status">nur lokal</div>
  </div>

    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    // X-Spiegelung der Projektion dreht die Winding-Order. Three.js ruft
    // state.setMaterial auf — frontFaceCW umkehren macht Wände wieder sichtbar.
    // Die Shadow-Map hat keine X-Spiegelung, dort bleibt die Winding normal.
    {
      let mirrorWinding = true;
      const setMaterial = renderer.state.setMaterial.bind(renderer.state);
      renderer.state.setMaterial = (material, frontFaceCW) => {
        setMaterial(material, mirrorWinding ? !frontFaceCW : frontFaceCW);
      };
      const shadowRender = renderer.shadowMap.render.bind(renderer.shadowMap);
      renderer.shadowMap.render = (lights, scene, camera) => {
        mirrorWinding = false;
        shadowRender(lights, scene, camera);
        mirrorWinding = true;
      };
    }
    wrap.appendChild(renderer.domElement);
    
    hideLoading();

    const labelRenderer = new CSS2DRenderer();

    const controls = new OrbitControls(camera, renderer.domElement);

    const ambient = new THREE.AmbientLight(0xfff6ea, 0.38);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffe2b8, 1.85);
    sun.position.set(50, 50, 25);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -55;

    sun.shadow.bias = -0.0006;
    sun.shadow.radius = 2.2;
    sun.target.position.set(0, 0, 2);
    scene.add(sun);
    scene.add(sun.target);
    const hemi = new THREE.HemisphereLight(0x9eb4c8, 0x3a3228, 0.42);
    scene.add(hemi);
    const topFill = new THREE.DirectionalLight(0xfff6ea, 0.18);
    topFill.position.set(8, 90, 12);

    let ydoc = null, yPositions = null, yCustomPieces = null, wsProvider = null;
    let isRemoteUpdate = false;
    let customPieceCounter = 0;
    let pendingPlacement = null;
    let syncReady = false;

    function initSyncLazy() {
      const connectTimeout = setTimeout(() => {
        if (!syncReady) {
          syncStatusEl.textContent = "nur lokal";
          syncStatusEl.classList.remove("connected");
        }
      }, 3000);

      Promise.all([
        import("https://cdn.jsdelivr.net/npm/yjs@13.6.10/+esm"),
        import("https://cdn.jsdelivr.net/npm/y-websocket@2.0.3/+esm")
      ]).then(([Y, YWebsocket]) => {
        ydoc = new Y.Doc();
        yPositions = ydoc.getMap("positions");
        yCustomPieces = ydoc.getMap("customPieces");
        
        try {
          wsProvider = new YWebsocket.WebsocketProvider(
            "wss://demos.yjs.dev",
            "stelle-ashausener-12-2026",
            ydoc
          );
          wsProvider.on("status", (event) => {
            if (event.status === "connected") {
              clearTimeout(connectTimeout);
              syncReady = true;
              syncStatusEl.textContent = "verbunden";
              syncStatusEl.classList.add("connected");
            } else {
              syncStatusEl.textContent = "nur lokal";
              syncStatusEl.classList.remove("connected");
            }
          });
          wsProvider.on("sync", (isSynced) => {
            if (isSynced) {
              applyRemoteCustomPieces();
              applyRemotePositions();
            }
          });
          yPositions.observe(() => {
            if (!isRemoteUpdate) applyRemotePositions();
          });
          yCustomPieces.observe(() => {
            if (!isRemoteUpdate) applyRemoteCustomPieces();
          });
        } catch (e) {
          clearTimeout(connectTimeout);
          syncStatusEl.textContent = "nur lokal";
        }
      }).catch(() => {
        clearTimeout(connectTimeout);
        syncStatusEl.textContent = "nur lokal";
      });
    }

    function applyRemotePositions() {
      if (!yPositions) return;
      isRemoteUpdate = true;
      yPositions.forEach((pos, pieceId) => {
        const group = pieceGroups.get(pieceId);
        if (group && pos) {
          group.position.x = pos.x;
          group.position.z = pos.z;
          if (group.userData.isPV) {
            const roofY = findRoofHeight(pos.x, pos.z, group);
            group.position.y = roofY !== null ? roofY : 0;
          } else {
            group.position.y = pos.y || 0;
          }
        }
      });
      isRemoteUpdate = false;
    }

    function applyRemoteCustomPieces() {
      if (!yCustomPieces) return;
      isRemoteUpdate = true;
      yCustomPieces.forEach((pieceData, pieceId) => {
        if (!pieceGroups.has(pieceId)) {
          createCustomPieceFromData(pieceId, pieceData);
        }
      });
      isRemoteUpdate = false;
    }

    function createCustomPieceFromData(pieceId, data) {
      const { name, w, d, h, x, y, z, color } = data;
      const piece = {
        id: pieceId,
        name: name,
        label: `${name} ${w}×${d}×${h} m`,
        layer: "CUSTOM",
        type: "box",
        draggable: true,
        position: [x, z],
        size: [w, d, h],
        color: color || "#7a9f7a"
      };
      
      const g = new THREE.Group();
      g.name = pieceId;
      g.add(box(w, h, d, piece.color, 0, 0, 0, piece.name));
      if (h > 3) g.add(box(w + 0.2, 0.2, d + 0.2, darkenColor(piece.color, 0.7), 0, h, 0));
      g.position.set(x, y, z);
      registerKit(g, piece);
      
      const idNum = parseInt(pieceId.replace("custom_", ""), 10);
      if (!isNaN(idNum) && idNum >= customPieceCounter) {
        customPieceCounter = idNum + 1;
      }
    }

    function broadcastPosition(pieceId, x, y, z) {
      if (isRemoteUpdate || !yPositions) return;
      yPositions.set(pieceId, { x, y, z });
    }

    function mat(color, opts = {}) {
      return new THREE.MeshStandardMaterial({
        color, roughness: opts.roughness ?? 0.8, metalness: opts.metalness ?? 0.05,
        transparent: !!opts.opacity, opacity: opts.opacity ?? 1,
        // Immer beidseitig: X-Spiegelung der Projektion cullt sonst Vorderwände.
        side: THREE.DoubleSide
      });
    }

    function createBrickTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#8a4a3a';
      ctx.fillRect(0, 0, 128, 128);
      const bricks = ['#b24a36', '#9e3f2e', '#c4563c', '#a84432'];
      for (let row = 0; row < 8; row++) {
        const offset = (row % 2) * 32;
        for (let col = 0; col < 4; col++) {
          const x = col * 64 + offset - 32;
          const y = row * 16;
          ctx.fillStyle = bricks[(row + col) % bricks.length];
          ctx.fillRect(x + 2, y + 2, 60, 12);
        }
      }
      ctx.strokeStyle = '#7a4034';
      ctx.lineWidth = 2;
      for (let row = 0; row <= 8; row++) {
        ctx.beginPath();
        ctx.moveTo(0, row * 16);
        ctx.lineTo(128, row * 16);
        ctx.stroke();
      }
      for (let row = 0; row < 8; row++) {
        const offset = (row % 2) * 32;
        for (let col = 0; col <= 4; col++) {
          ctx.beginPath();
          ctx.moveTo(col * 64 + offset - 32, row * 16);
          ctx.lineTo(col * 64 + offset - 32, (row + 1) * 16);
          ctx.stroke();
        }
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function matBrick(repeatX = 4, repeatY = 2) {
      const texture = createBrickTexture();
      texture.repeat.set(repeatX, repeatY);
      return new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.9,
        metalness: 0.0,
        side: THREE.DoubleSide
      });
    }

    function matPlaster(color) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness: 0.95,
        metalness: 0.0,
        side: THREE.DoubleSide
      });
    }

    function box(w, h, d, color, x, y, z, name, opacity) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, { opacity }));
      m.position.set(x, y + h / 2, z);
      m.castShadow = h > 0.5;
      m.receiveShadow = true;
      if (name) m.name = name;
      return m;
    }

    function boxWithMaterial(w, h, d, material, x, y, z, name) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      m.position.set(x, y + h / 2, z);
      m.castShadow = h > 0.5;
      m.receiveShadow = true;
      if (name) m.name = name;
      return m;
    }

    function createSaddleRoof(w, d, roofHeight, overhang, color) {
      const g = new THREE.Group();
      const hw = w / 2 + overhang;
      const hd = d / 2 + overhang;
      
      const vertices = new Float32Array([
        -hw, 0, -hd,   hw, 0, -hd,   0, roofHeight, -hd,
        -hw, 0,  hd,   0, roofHeight,  hd,   hw, 0,  hd,
        -hw, 0, -hd,   0, roofHeight, -hd,   0, roofHeight,  hd,   -hw, 0,  hd,
         hw, 0, -hd,    hw, 0,  hd,   0, roofHeight,  hd,   0, roofHeight, -hd,
        -hw, 0, -hd,   -hw, 0,  hd,    hw, 0,  hd,    hw, 0, -hd,
      ]);
      
      const indices = [
        0, 1, 2,
        3, 4, 5,
        6, 7, 8,  6, 8, 9,
        10, 11, 12,  10, 12, 13,
        14, 15, 16,  14, 16, 17,
      ];
      
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      
      const roofMat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.1, side: THREE.DoubleSide });
      const roof = new THREE.Mesh(geom, roofMat);
      roof.castShadow = true;
      roof.receiveShadow = true;
      g.add(roof);
      
      return g;
    }

    function createLeanToRoof(w, d, roofHeight, overhang, color) {
      const g = new THREE.Group();
      const hw = w / 2 + overhang;
      const hd = d / 2 + overhang * 0.35;
      const verts = new Float32Array([
        -hw, roofHeight, -hd,
         hw, roofHeight, -hd,
         hw, 0, hd,
        -hw, 0, hd
      ]);
      const geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.BufferAttribute(verts, 3));
      geom.setIndex([0, 2, 1, 0, 3, 2]);
      geom.computeVertexNormals();
      const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
        color, roughness: 0.85, metalness: 0.08, side: THREE.DoubleSide
      }));
      mesh.castShadow = true;
      g.add(mesh);
      return g;
    }

    function createHipRoof(w, d, roofHeight, overhang, color) {
      const g = new THREE.Group();
      const hw = w / 2 + overhang;
      const hd = d / 2 + overhang;
      const rw = Math.max(0.4, w * 0.28);
      const verts = new Float32Array([
        -hw, 0, -hd,   hw, 0, -hd,   rw, roofHeight, 0,   -rw, roofHeight, 0,
        -hw, 0,  hd,   -rw, roofHeight, 0,   rw, roofHeight, 0,   hw, 0,  hd,
        -hw, 0, -hd,   -rw, roofHeight, 0,   -hw, 0,  hd,
         hw, 0, -hd,    hw, 0,  hd,   rw, roofHeight, 0
      ]);
      const idx = [
        0, 1, 2,  0, 2, 3,
        4, 5, 6,  4, 6, 7,
        8, 9, 10,
        11, 12, 13
      ];
      const geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.BufferAttribute(verts, 3));
      geom.setIndex(idx);
      geom.computeVertexNormals();
      const roof = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
        color, roughness: 0.85, metalness: 0.08, side: THREE.DoubleSide
      }));
      roof.castShadow = true;
      g.add(roof);
      return g;
    }

    function createWindow(w, h, frameColor, glassColor) {
      const g = new THREE.Group();
      const frameThickness = 0.05;
      const frameMat = mat(frameColor);
      const glassMat = new THREE.MeshStandardMaterial({ 
        color: glassColor, 
        roughness: 0.1, 
        metalness: 0.3,
        transparent: true,
        opacity: 0.6
      });
      const glass = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.1, h - 0.1), glassMat);
      glass.position.z = 0.02;
      g.add(glass);
      const frameTop = new THREE.Mesh(new THREE.BoxGeometry(w, frameThickness, 0.08), frameMat);
      frameTop.position.set(0, h/2 - frameThickness/2, 0);
      g.add(frameTop);
      const frameBottom = frameTop.clone();
      frameBottom.position.y = -h/2 + frameThickness/2;
      g.add(frameBottom);
      const frameLeft = new THREE.Mesh(new THREE.BoxGeometry(frameThickness, h, 0.08), frameMat);
      frameLeft.position.set(-w/2 + frameThickness/2, 0, 0);
      g.add(frameLeft);
      const frameRight = frameLeft.clone();
      frameRight.position.x = w/2 - frameThickness/2;
      g.add(frameRight);
      const frameMid = new THREE.Mesh(new THREE.BoxGeometry(frameThickness * 0.7, h - 0.1, 0.06), frameMat);
      g.add(frameMid);
      return g;
    }

    function createDoor(w, h, color, handleColor) {
      const g = new THREE.Group();
      const doorMat = mat(color, { roughness: 0.7 });
      const door = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), doorMat);
      g.add(door);
      const frameMat = mat(0x4a3a2a);
      const frameTop = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, 0.06, 0.1), frameMat);
      frameTop.position.set(0, h/2, 0);
      g.add(frameTop);
      const frameLeft = new THREE.Mesh(new THREE.BoxGeometry(0.06, h + 0.06, 0.1), frameMat);
      frameLeft.position.set(-w/2 - 0.03, 0, 0);
      g.add(frameLeft);
      const frameRight = frameLeft.clone();
      frameRight.position.x = w/2 + 0.03;
      g.add(frameRight);
      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.15, 0.05), mat(handleColor, { metalness: 0.8, roughness: 0.2 }));
      handle.position.set(w/2 - 0.15, 0, 0.06);
      g.add(handle);
      return g;
    }

    function createDetailedHouse(w, d, wallHeight, roofHeight, config = {}) {
      const g = new THREE.Group();
      const useBrick = config.brick !== false;
      const wallMat = useBrick ? matBrick(w/3, wallHeight/2) : matPlaster(config.wallColor || 0xf5f0e6);
      const roofCol = config.roofColor || "#3d383c";
      const overhang = config.roofOverhang ?? 0.35;
      if (config.frontWalls) wallMat.side = THREE.FrontSide;
      g.add(boxWithMaterial(w, wallHeight, d, wallMat, 0, 0, 0, config.name || "Haus"));
      if (roofHeight > 0) {
        let roof;
        if (config.roofStyle === "lean") roof = createLeanToRoof(w, d, roofHeight, overhang, roofCol);
        else if (config.roofStyle === "hip") roof = createHipRoof(w, d, roofHeight, overhang, roofCol);
        else roof = createSaddleRoof(w, d, roofHeight, overhang, roofCol);
        roof.position.y = wallHeight;
        g.add(roof);
      }
      if (config.erker) {
        const ew = config.erker.w || 3.2, ed = config.erker.d || 1.1, eh = config.erker.h || 2.4;
        const ez = -(d / 2) - ed / 2 + 0.38;
        g.add(boxWithMaterial(ew, eh, ed, wallMat, 0, 0, ez, "Erker"));
        g.add(box(ew + 0.15, 0.12, ed + 0.15, 0x2a2a2e, 0, eh, ez, "Erkerdach"));
        const bayWin = createWindow(ew - 0.4, 1.3, 0xffffff, 0x87ceeb);
        bayWin.position.set(0, eh * 0.48, ez - ed / 2 - 0.02);
        g.add(bayWin);
      }
      if (config.dormer) {
        const dw = config.dormer.w || 3.4, dd = config.dormer.d || 1.4, dh = config.dormer.h || 1.8;
        const dy = wallHeight - 0.15;
        const dz = -(d / 2) + dd / 2 + 0.1;
        g.add(boxWithMaterial(dw, dh, dd, wallMat, 0, dy, dz, "Zwerchhaus"));
        const dRoof = createHipRoof(dw, dd, 1.05, 0.12, roofCol);
        dRoof.position.set(0, dy + dh, dz);
        g.add(dRoof);
        const dw1 = createWindow(1.0, 1.0, 0xffffff, 0x87ceeb);
        dw1.position.set(-0.7, dy + dh * 0.45, dz - dd / 2 - 0.02);
        const dw2 = createWindow(1.0, 1.0, 0xffffff, 0x87ceeb);
        dw2.position.set(0.7, dy + dh * 0.45, dz - dd / 2 - 0.02);
        g.add(dw1, dw2);
      }
      if (config.houseNumber) {
        const el = document.createElement("div");
        el.className = "label pin";
        el.textContent = String(config.houseNumber);
        const num = new CSS2DObject(el);
        num.position.set(-w * 0.36, 2.15, -d / 2 - 0.06);
        g.add(num);
      }
      if (config.windows) {
        for (const win of config.windows) {
          const window = createWindow(win.w || 1.2, win.h || 1.4, 0xffffff, 0x87ceeb);
          window.position.set(win.x, win.y, win.z);
          if (win.rotY) window.rotation.y = win.rotY;
          g.add(window);
        }
      }
      if (config.door) {
        const door = createDoor(config.door.w || 1.0, config.door.h || 2.2, 0x5a4a3a, 0xc0c0c0);
        door.position.set(config.door.x, config.door.y, config.door.z);
        if (config.door.rotY) door.rotation.y = config.door.rotY;
        g.add(door);
      }
      if (config.garageDoor) {
        const gw = config.garageDoor.w || 2.4, gh = config.garageDoor.h || 2.1;
        const face = config.garageDoor.face || "-z";
        const doorG = new THREE.Group();
        if (face === "+z") {
          doorG.position.set(0, 0, d / 2 + 0.04);
          doorG.rotation.y = Math.PI;
        } else if (face === "-x") {
          doorG.position.set(-w / 2 - 0.04, 0, 0);
          doorG.rotation.y = Math.PI / 2;
        } else if (face === "+x") {
          doorG.position.set(w / 2 + 0.04, 0, 0);
          doorG.rotation.y = -Math.PI / 2;
        } else {
          doorG.position.set(0, 0, -d / 2 - 0.04);
        }
        const door = new THREE.Mesh(new THREE.BoxGeometry(gw, gh, 0.08), mat(0xf2f2f0, { roughness: 0.55 }));
        door.position.y = gh / 2 + 0.08;
        doorG.add(door);
        const nRibs = 9;
        for (let i = 0; i < nRibs; i++) {
          const rib = new THREE.Mesh(new THREE.BoxGeometry(0.045, gh * 0.92, 0.03), mat(0xd4d4d0));
          rib.position.set(-gw / 2 + (i + 0.5) * (gw / nRibs), gh / 2 + 0.08, -0.05);
          doorG.add(rib);
        }
        g.add(doorG);
      }
      if (config.openBay) {
        const bw = config.openBay.w || 3.4, bh = config.openBay.h || 2.15;
        const bay = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 0.08), mat(0x1c1c1c, { roughness: 0.95 }));
        bay.position.set(0, bh / 2 + 0.08, -d / 2 - 0.03);
        g.add(bay);
      }
      return g;
    }

    function cyl(r, h, color, x, y, z, name, segs = 28) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, segs), mat(color));
      m.position.set(x, y + h / 2, z);
      m.castShadow = true;
      m.receiveShadow = true;
      if (name) m.name = name;
      return m;
    }

    function makeShape(vertices) {
      const shape = new THREE.Shape();
      shape.moveTo(vertices[0][0], -vertices[0][1]);
      for (let i = 1; i < vertices.length; i++) shape.lineTo(vertices[i][0], -vertices[i][1]);
      shape.closePath();
      return shape;
    }

    function expandFromCentroid(verts, dist) {
      let cx = 0, cz = 0;
      for (const v of verts) { cx += v[0]; cz += v[1]; }
      cx /= verts.length;
      cz /= verts.length;
      return verts.map((v) => {
        const dx = v[0] - cx, dz = v[1] - cz;
        const len = Math.hypot(dx, dz) || 1;
        return [v[0] + (dx / len) * dist, v[1] + (dz / len) * dist];
      });
    }

    function applySatUV(geom, sat) {
      const [w, d] = sat.size;
      const [cx, cz] = sat.center || [0, 0];
      const pos = geom.attributes.position;
      const uv = new Float32Array(pos.count * 2);
      for (let i = 0; i < pos.count; i++) {
        const worldX = pos.getX(i);
        const worldZ = -pos.getY(i);
        uv[i * 2] = (worldX - (cx - w / 2)) / w;
        uv[i * 2 + 1] = (worldZ - (cz - d / 2)) / d;
      }
      geom.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    }

    function polygon(vertices, height, color, opacity = 1) {
      const shape = makeShape(vertices);
      const geometry = height > 0
        ? new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false })
        : new THREE.ShapeGeometry(shape);
      const material = mat(color, { opacity });
      if (opacity < 0.99) {
        material.transparent = true;
        material.depthWrite = false;
        material.polygonOffset = true;
        material.polygonOffsetFactor = -2;
        material.polygonOffsetUnits = -2;
      }
      const mesh = new THREE.Mesh(geometry, material);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = height > 0 ? 0 : 0;
      mesh.receiveShadow = opacity >= 0.99;
      return mesh;
    }

      }
      if (piece.parked) group.visible = false;
      kit.add(group);
      draggables.push(group);
      home.set(group, group.position.clone());
      pieceGroups.set(piece.id, group);
    }

    function buildScene(data) {
      kitData = data;
      SITE_W = data.site.width;
      SITE_D = data.site.depth;
      HALF_W = SITE_W / 2;
      HALF_D = SITE_D / 2;
      if (data.site.bbox) SITE_BBOX = data.site.bbox;

      const boundary = data.pieces.find(p => p.id === "site_boundary");
      SITE_POLY = boundary && boundary.vertices ? boundary.vertices : [
        [-HALF_W, -HALF_D], [HALF_W, -HALF_D], [HALF_W, HALF_D], [-HALF_W, HALF_D]
      ];

      parkEnabled = !!(data.parkplatz && data.parkplatz.enabled);
      if (parkEnabled) {
        PARK_X = data.parkplatz.position[0];
        PARK_Z = data.parkplatz.position[1];
        PARK_W = data.parkplatz.size[0];
        PARK_D = data.parkplatz.size[1];
      }

      const SLAB_H = 3.2;
      ISLAND_POLY = expandFromCentroid(SITE_POLY, 4.5);

      const slabShape = makeShape(ISLAND_POLY);
      const slabGeom = new THREE.ExtrudeGeometry(slabShape, {
        depth: SLAB_H,
        bevelEnabled: false
      });
      slabGeom.computeVertexNormals();
      const slab = new THREE.Mesh(slabGeom, mat(0x4a4038, { roughness: 0.96, metalness: 0 }));
      slab.rotation.x = -Math.PI / 2;
      slab.position.y = -SLAB_H;
      slab.castShadow = true;
      slab.receiveShadow = true;
      slab.name = "Diorama_Sockel";
      context.add(slab);

      const lawn = polygon(ISLAND_POLY, 0, "#5f7a48", 1);
      lawn.name = "Rasen";
      lawn.position.y = 0.02;
      lawn.userData.satHide = true;
      context.add(lawn);
      addSatelliteLayer(data, lawn);

      if (parkEnabled) addParkplatz(data.parkplatz);
      addFence(SITE_POLY);
      addStreetHedge();
      addOsterfeldHedge();
      addDrivewayCar();

      for (const piece of data.pieces) buildPiece(piece, data.layers);
      hideOffIslandNeighbors();
      setSatelliteVisible(true);
    }

    function buildPiece(piece, layers) {
      const layerDef = layers[piece.layer] || {};
      const color = piece.color || layerDef.color || "#888888";

      if (piece.layer === "ABSTAND" || piece.layer === "LAERMSTREIFEN") {
        return;
      }

      if (piece.type === "polygon" && !piece.draggable) {
        const verts = piece.vertices;
        const offsetVerts = piece.position ? verts.map(v => [v[0] + piece.position[0], v[1] + piece.position[1]]) : verts;
        
        if (piece.layer === "BAUFENSTER") {
          const fill = polygon(offsetVerts, 0, "#d4a017", 0.4);
          fill.name = piece.name;
          fill.position.y = 0.05;
          fill.userData.satHide = true;
          context.add(fill);
          const lineVerts = [...offsetVerts, offsetVerts[0]];
          const lineGeom = new THREE.BufferGeometry().setFromPoints(lineVerts.map(v => new THREE.Vector3(v[0], 0.08, v[1])));
          const baufensterLine = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0xd4a017, linewidth: 2 }));
          baufensterLine.name = piece.name + "_Linie";
          context.add(baufensterLine);
          const centroid = offsetVerts.reduce((acc, v) => [acc[0] + v[0], acc[1] + v[1]], [0, 0]);
          centroid[0] /= offsetVerts.length;
          centroid[1] /= offsetVerts.length;
          const labelGroup = new THREE.Group();
          labelGroup.position.set(centroid[0], 0, centroid[1]);
          labelGroup.add(makeLabel("Baugrenze", 0.5));
          planLabels.add(labelGroup);
          return;
        }
        
        if (piece.layer === "SITE_BOUNDARY") {
          const lineVerts = [...offsetVerts, offsetVerts[0]];
          const lineGeom = new THREE.BufferGeometry().setFromPoints(lineVerts.map(v => new THREE.Vector3(v[0], 0.06, v[1])));
          context.add(new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color })));
          return;
        }

        if (piece.layer === "PARCEL") {
          const mesh = polygon(offsetVerts, 0, color, piece.fillOpacity || 0.18);
          mesh.name = piece.name;
          mesh.position.y = 0.025;
          mesh.userData.satHide = true;
          parcelFill = mesh;
          context.add(mesh);
          const lineVerts = [...offsetVerts, offsetVerts[0]];
          const lineGeom = new THREE.BufferGeometry().setFromPoints(lineVerts.map(v => new THREE.Vector3(v[0], 0.07, v[1])));
          context.add(new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0xc4a030 })));
          return;
        }

        if (piece.layer === "STRASSE") {
          const mesh = polygon(offsetVerts, piece.height || 0.02, color, 0.95);
          mesh.name = piece.name;
          mesh.userData.satHide = true;
          context.add(mesh);
          return;
        }
        
        const mesh = polygon(offsetVerts, piece.height || 0, color, piece.fillOpacity || 0.6);
        mesh.name = piece.name;
        context.add(mesh);
        const lineVerts = [...offsetVerts, offsetVerts[0]];
        const lineGeom = new THREE.BufferGeometry().setFromPoints(lineVerts.map(v => new THREE.Vector3(v[0], piece.height + 0.05, v[1])));
        context.add(new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color })));
      }
      else if (piece.type === "box") {
        if (piece.id === "bestand_wohnhaus_fluegel" || piece.id === "bestand_wohnhaus_anbau") {
          return;
        }
        const g = new THREE.Group();
        g.name = piece.id;
        const [w, d, h] = piece.size;

        if (piece.id === "bestand_wohnhaus") {
          g.add(createBestandWohnhaus12());
          g.position.set(piece.position[0], 0, piece.position[1]);
          if (piece.rotation) g.rotation.y = piece.rotation;
          context.add(g);
          return;
        }

        if (piece.detailed) {
          const detailedHouse = createDetailedHouse(w, d, piece.wallHeight || h, piece.roofHeight || 0, {
            name: piece.name,
            brick: piece.brick,
            wallColor: piece.wallColor,
            roofColor: piece.roofColor || "#3d383c",
            roofStyle: piece.roofStyle,
            windows: piece.windows,
            door: piece.door,
            erker: piece.erker,
            dormer: piece.dormer,
            houseNumber: piece.houseNumber,
            garageDoor: piece.garageDoor,
            openBay: piece.openBay
          });
          g.add(detailedHouse);
        } else {
          g.add(box(w, h, d, color, 0, 0, 0, piece.name));
          if (h > 3) g.add(box(w + 0.2, 0.2, d + 0.2, darkenColor(color, 0.7), 0, h, 0));
        }
        g.position.set(piece.position[0], 0, piece.position[1]);
        if (piece.rotation) g.rotation.y = piece.rotation;
        if (piece.layer === "NACHBAR") {
          g.userData.dioramaOff = true;
        }
        if (piece.draggable) registerKit(g, piece);
        else context.add(g);
      }
      else if (piece.type === "cylinder") {
        const g = new THREE.Group();
        g.name = piece.id;
        g.add(cyl(piece.radius, piece.height, color, 0, 0, 0, piece.name));
        g.add(cyl(piece.radius + 0.05, 0.1, darkenColor(color, 0.8), 0, piece.height, 0, null, 28));
        g.position.set(piece.position[0], 0, piece.position[1]);
        if (piece.draggable) registerKit(g, piece);
        else context.add(g);
      }
      else if (piece.type === "tree") {
        treesGroup.add(treeMass(piece.position[0], piece.position[1], piece.radius, piece.height, piece.name, piece.kind || "deciduous"));
      }
      else if (piece.type === "polygon" && piece.draggable) {
        const g = new THREE.Group();
        g.name = piece.id;
        g.add(polygon(piece.vertices, piece.height || 0.3, color, 0.8));
        g.position.set(piece.position[0], 0, piece.position[1]);
        registerKit(g, piece);
      }
    }

    function darkenColor(hex, factor) {
      const c = new THREE.Color(hex);
      c.multiplyScalar(factor);
      return c;
    }

    function addFence(verts) {
      const fenceGroup = new THREE.Group();
      fenceGroup.name = "Zaun";
      fenceGroup.userData.satHide = true;
      const postMat = mat(0x5a4632);
      const railMat = mat(0x6a5340);
      function addFenceRun(ax, az, bx, bz) {
        const dx = bx - ax, dz = bz - az;
        const len = Math.hypot(dx, dz);
        const n = Math.max(2, Math.round(len / 4));
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          const p = cyl(0.07, 1.1, 0x5a4632, ax + dx * t, 0, az + dz * t);
          p.material = postMat;
          fenceGroup.add(p);
        }
        const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.05, 0.05), railMat);
        rail.position.set((ax + bx) / 2, 0.9, (az + bz) / 2);
        rail.rotation.y = Math.atan2(dx, dz) + Math.PI / 2;
        rail.castShadow = true;
        fenceGroup.add(rail);
        const rail2 = rail.clone();
        rail2.position.y = 0.5;
        fenceGroup.add(rail2);
      }
      for (let i = 0; i < verts.length; i++) {
        const a = verts[i];
        const b = verts[(i + 1) % verts.length];
        addFenceRun(a[0], a[1], b[0], b[1]);
      }
      context.add(fenceGroup);
    }

    function addHedgeRun(group, mat, ax, az, bx, bz, width, height) {
      const dx = bx - ax, dz = bz - az;
      const len = Math.hypot(dx, dz);
      if (len < 0.4) return;
      const m = new THREE.Mesh(new THREE.BoxGeometry(len, height, width), mat);
      m.position.set((ax + bx) / 2, height / 2, (az + bz) / 2);
      m.rotation.y = Math.atan2(dx, dz);
      m.castShadow = true;
      m.receiveShadow = true;
      group.add(m);
    }

    function addStreetHedge() {
      const hedgeGroup = new THREE.Group();
      hedgeGroup.name = "Hecke_Ashausener";
      const hedgeMat = mat(0x3d6b38, { roughness: 0.95 });
      const segs = [
        { pos: [-15.4, -5.9], size: [8.5, 1.15, 0.62], rot: 0.982 },
        { pos: [-10.6, -11.3], size: [6.5, 1.15, 0.62], rot: 0.982 },
        { pos: [-19.8, 0.4], size: [7.2, 1.2, 0.7], rot: 0.982 }
      ];
      for (const s of segs) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(s.size[0], s.size[1], s.size[2]), hedgeMat);
        m.position.set(s.pos[0], s.size[1] / 2, s.pos[1]);

    function addOsterfeldHedge() {
      const hedgeGroup = new THREE.Group();
      hedgeGroup.name = "Hecke_Osterfeld";
      const hedgeMat = mat(0x355e32, { roughness: 0.96 });
      const a = [-8.13, 38.75], b = [26.54, 26.27];
      const dx = b[0] - a[0], dz = b[1] - a[1];
      const len = Math.hypot(dx, dz);
      const nx = dz / len, nz = -dx / len;
      const inset = 1.35;

        hedgeGroup, hedgeMat,
        a[0] + nx * inset, a[1] + nz * inset,

      );

    }

    const raycaster = new THREE.Raycaster();
    const roofRaycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const hit = new THREE.Vector3();
    let dragging = null;
    let offset = new THREE.Vector3();

    function findRoofHeight(x, z, excludeGroup) {
      roofRaycaster.set(new THREE.Vector3(x, 50, z), new THREE.Vector3(0, -1, 0));
      const candidates = [...context.children, ...kit.children].filter(obj => obj !== excludeGroup);
      const hits = roofRaycaster.intersectObjects(candidates, true);
      for (const h of hits) {
        if (h.object.name === "Rasen" || h.object.name === "Umgebung" || h.object.name === "Parkplatz_Fläche") continue;
        let parent = h.object;
        while (parent && parent !== excludeGroup) {
          if (parent.userData.draggable && parent === excludeGroup) break;
          parent = parent.parent;
        }
        if (parent === excludeGroup) continue;
        if (h.point.y > 0.1) return h.point.y;
      }
      return null;
    }

    function ndc(ev) {
      const r = renderer.domElement.getBoundingClientRect();
      pointer.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
      pointer.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
    }

    function pick(ev) {
      ndc(ev);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(draggables, true);
      if (!hits.length) return null;
      let obj = hits[0].object;
      while (obj && !obj.userData.draggable) obj = obj.parent;
      return obj;
    }

    function pointInPoly(x, z, verts) {
      let inside = false;
      for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
        const xi = verts[i][0], zi = verts[i][1];
        const xj = verts[j][0], zj = verts[j][1];
        const intersect = ((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / ((zj - zi) || 1e-9) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function clampToBounds(v, isPV = false, excludeGroup = null) {
      const inSite = pointInPoly(v.x, v.z, SITE_POLY);
      const [minX, minZ, maxX, maxZ] = SITE_BBOX;
      let inPark = false;
      if (parkEnabled) {
        const parkLeft = PARK_X - PARK_W / 2;
        const parkRight = PARK_X + PARK_W / 2;
        const parkTop = PARK_Z + PARK_D / 2;
        const parkBottom = PARK_Z - PARK_D / 2;
        inPark = v.x >= parkLeft && v.x <= parkRight && v.z >= parkBottom && v.z <= parkTop;
      }

      if (!inSite && !inPark) {
        v.x = THREE.MathUtils.clamp(v.x, minX + 2, maxX - 2);
        v.z = THREE.MathUtils.clamp(v.z, minZ + 2, maxZ - 2);
      }
      
      if (isPV) {
        const roofY = findRoofHeight(v.x, v.z, excludeGroup);
        v.y = roofY !== null ? roofY : 0;
      } else {
        v.y = 0;
      }
      return v;
    }

    renderer.domElement.addEventListener("pointerdown", (ev) => {
      if (ev.button !== 0) return;
      
      if (pendingPlacement) {
        placePendingObject(ev);
        return;
      }
      
      const obj = pick(ev);
      if (!obj) return;
      ndc(ev);
      raycaster.setFromCamera(pointer, camera);
      if (!raycaster.ray.intersectPlane(groundPlane, hit)) return;
      dragging = obj;
      offset.set(obj.position.x - hit.x, 0, obj.position.z - hit.z);
      controls.enabled = false;
      statusEl.textContent = "Verschieben: " + (obj.name || "Teil");
    });

    renderer.domElement.addEventListener("pointermove", (ev) => {
      if (!dragging) return;
      ndc(ev);
      raycaster.setFromCamera(pointer, camera);
      if (!raycaster.ray.intersectPlane(groundPlane, hit)) return;
      const isPV = dragging.userData.isPV || false;
      dragging.position.copy(clampToBounds(hit.add(offset), isPV, dragging));
    });

    function endDrag() {
      if (!dragging) return;
      const pieceId = dragging.userData.pieceId;
      if (pieceId) {
        broadcastPosition(pieceId, dragging.position.x, dragging.position.y, dragging.position.z);
      }
      dragging = null;
      controls.enabled = true;
      statusEl.textContent = "Bereit";
    }
    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointerleave", endDrag);

    function resetKit() {
      activeVariant = null;
      document.querySelectorAll(".variant-btn").forEach(btn => btn.classList.remove("active"));
      setBestandVisible(true);
      const stockIds = new Set([...Object.values(variantIds), ...Object.keys(extraPlacePos)]);
      for (const g of draggables) {
        const p = home.get(g);
        g.position.copy(p);
        const pieceId = g.userData.pieceId;
        g.visible = !stockIds.has(pieceId);
        if (pieceId) broadcastPosition(pieceId, p.x, p.y, p.z);
      }
      statusEl.textContent = "Zurückgesetzt";
    }

    function setBestandVisible(visible) {
      context.traverse((obj) => {
        if (typeof obj.name === "string" && obj.name.startsWith("bestand_")) {
          obj.visible = visible;
        }
      });
    }

    function selectVariant(variantKey) {
      const turningOff = activeVariant === variantKey;
      activeVariant = turningOff ? null : variantKey;

      document.querySelectorAll(".variant-btn").forEach(btn => btn.classList.remove("active"));
      if (activeVariant) {
        const activeBtn = document.querySelector(`[data-variant="${activeVariant}"]`);
        if (activeBtn) activeBtn.classList.add("active");
      }

      setBestandVisible(activeVariant !== "ersatz");

      for (const [vk, vId] of Object.entries(variantIds)) {
        const group = pieceGroups.get(vId);
        if (!group) continue;
        if (vk === activeVariant) {
          const place = variantPlacePos[vk] || { x: 5.17, z: 21.47 };
          group.position.set(place.x, 0, place.z);
          group.visible = true;
        } else {
          const parkedPos = variantParkedPos[vk];
          if (parkedPos) group.position.set(parkedPos.x, 0, parkedPos.z);
          group.visible = false;
        }
        broadcastPosition(vId, group.position.x, group.position.y, group.position.z);
      }
    }

    function placeExtra(pieceId) {
      const group = pieceGroups.get(pieceId);
      const place = extraPlacePos[pieceId];
      if (!group || !place) return;
      group.position.set(place.x, 0, place.z);
      if (group.userData.isPV) {
        const roofY = findRoofHeight(place.x, place.z, group);
        group.position.y = roofY !== null ? roofY : 0;
      }
      group.visible = true;
      broadcastPosition(pieceId, group.position.x, group.position.y, group.position.z);
      statusEl.textContent = (group.name || pieceId) + " platziert";
    }

    document.querySelectorAll(".variant-btn").forEach(btn => {
      btn.addEventListener("click", () => selectVariant(btn.dataset.variant));
    });
    document.getElementById("btn-extra-pv").addEventListener("click", () => placeExtra("pv_feld"));
    document.getElementById("btn-extra-zisterne").addEventListener("click", () => placeExtra("zisterne"));
    document.getElementById("btn-extra-gruen").addEventListener("click", () => placeExtra("gruenflaeche_1"));
    document.getElementById("btn-trees").addEventListener("click", () => {
      const on = !treesGroup.visible;
      treesGroup.visible = on;
      document.getElementById("btn-trees").classList.toggle("active", on);
    });

    const placeHint = document.getElementById("place-hint");
    
    document.getElementById("btn-create").addEventListener("click", () => {
      const nameInput = document.getElementById("new-name");
      const widthInput = document.getElementById("new-width");
      const depthInput = document.getElementById("new-depth");
      const heightInput = document.getElementById("new-height");
      
      const name = nameInput.value.trim() || "Objekt";
      const w = parseFloat(widthInput.value) || 4;
      const d = parseFloat(depthInput.value) || 3;
      const h = parseFloat(heightInput.value) || 2.5;
      
      pendingPlacement = { name, w, d, h };
      placeHint.style.display = "block";
      statusEl.textContent = "Platzierung: Klicken Sie auf die gewünschte Stelle";
      renderer.domElement.style.cursor = "crosshair";
    });

    function placePendingObject(ev) {
      if (!pendingPlacement) return;
      
      ndc(ev);
      raycaster.setFromCamera(pointer, camera);
      
      const allMeshes = [...context.children, ...kit.children];
      const hits = raycaster.intersectObjects(allMeshes, true);
      
      let placeX = 0, placeY = 0, placeZ = 0;
      let foundHit = false;
      
      for (const h of hits) {
        const objName = h.object.name;
        if (objName === "Rasen" || objName === "Umgebung" || objName === "Parkplatz_Fläche" || 
            objName === "Baufenster" || h.object.geometry instanceof THREE.PlaneGeometry) {
          placeX = h.point.x;
          placeZ = h.point.z;
          placeY = 0;
          foundHit = true;
          break;
        } else {
          placeX = h.point.x;
          placeZ = h.point.z;
          placeY = h.point.y;
          foundHit = true;
          break;
        }
      }
      
      if (!foundHit) {
        if (raycaster.ray.intersectPlane(groundPlane, hit)) {
          placeX = hit.x;
          placeZ = hit.z;
          placeY = 0;
        } else {
          return;
        }
      }
      
      const pieceId = "custom_" + customPieceCounter++;
      const { name, w, d, h } = pendingPlacement;
      const color = "#7a9f7a";
      
      const pieceData = { name, w, d, h, x: placeX, y: placeY, z: placeZ, color };
      
      createCustomPieceFromData(pieceId, pieceData);
      
      if (yCustomPieces) yCustomPieces.set(pieceId, pieceData);
      broadcastPosition(pieceId, placeX, placeY, placeZ);
      
      pendingPlacement = null;
      placeHint.style.display = "none";
      renderer.domElement.style.cursor = "default";
      statusEl.textContent = `${name} platziert`;
      
      document.getElementById("new-name").value = "";
      document.getElementById("new-width").value = "";
      document.getElementById("new-depth").value = "";
      document.getElementById("new-height").value = "";
    }

    function applyProjection() {
      camera.updateProjectionMatrix();
      camera.projectionMatrix.elements[0] *= -1;
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
    }

    const MAP_POLAR = 0.36;
    const TOP_POS = new THREE.Vector3(0, 118, -38);
    const TOP_TARGET = new THREE.Vector3(0, 0, 2);
    const _viewOffset = new THREE.Vector3();
    let camAnimating = false;
    let viewPointerDown = false;

    renderer.domElement.addEventListener("pointerdown", () => { viewPointerDown = true; });
    window.addEventListener("pointerup", () => {
      if (!viewPointerDown) return;
      viewPointerDown = false;
      syncViewFromPolar(true);
    });

    function setMapLock(on) {
      if (on) {
        controls.minAzimuthAngle = Math.PI;
        controls.maxAzimuthAngle = Math.PI;
      } else {
        controls.minAzimuthAngle = -Infinity;
        controls.maxAzimuthAngle = Infinity;
      }
    }

    function currentPolar() {
      _viewOffset.copy(camera.position).sub(controls.target);
      return _viewOffset.angleTo(camera.up);
    }

    function syncViewFromPolar(force) {
      const polar = currentPolar();
      const wantMap = polar < MAP_POLAR;
      document.getElementById("compass").classList.toggle("tilted", !wantMap);
      if (wantMap === northUpMode) return;
      if (viewPointerDown && !force && !camAnimating) return;
      northUpMode = wantMap;
      if (!camAnimating) setMapLock(wantMap);
      applySceneChrome();
    }

    function animateCamera(pos, tgt, asMap) {
      camAnimating = true;
      controls.enabled = false;
      if (!asMap) {
        northUpMode = false;
        setMapLock(false);
        applySceneChrome();
      }
      const p0 = camera.position.clone();
      const t0 = controls.target.clone();
      const start = performance.now();
      const dur = 700;
      function step(now) {
        const u = Math.min(1, (now - start) / dur);
        const e = 1 - Math.pow(1 - u, 3);
        camera.position.lerpVectors(p0, pos, e);
        controls.target.lerpVectors(t0, tgt, e);
        camera.lookAt(controls.target);
        syncViewFromPolar();
        if (u < 1) {
          requestAnimationFrame(step);
        } else {
          camAnimating = false;
          controls.enabled = true;
          if (asMap) {
            northUpMode = true;
            setMapLock(true);
          }
          applyProjection();
          controls.update();
          applySceneChrome();
          syncViewFromPolar();
        }
      }
      requestAnimationFrame(step);
    }

    function applyNorthUpView(instant) {
      camera.up.set(0, 1, 0);
      if (instant === true) {
        camera.position.copy(TOP_POS);
        controls.target.copy(TOP_TARGET);
        northUpMode = true;
        setMapLock(true);
        applyProjection();
        controls.update();
        applySceneChrome();
        syncViewFromPolar();
        return;
      }
      animateCamera(TOP_POS, TOP_TARGET, true);
    }

    function requestNorthUpView(ev) {
      if (ev) ev.stopPropagation();
      applyNorthUpView();
    }

    document.getElementById("btn-reset").addEventListener("click", resetKit);
    document.getElementById("compass").addEventListener("click", requestNorthUpView);
    window.__goNorthUp = applyNorthUpView;
    document.getElementById("btn-sat").addEventListener("click", () => setSatelliteVisible(!satelliteOn));
    wrap.addEventListener("dblclick", (e) => {
      if (e.target.closest("#topbar, .ui, footer, #status")) return;
      applyNorthUpView();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (e.target.closest("input, textarea")) return;
      applyNorthUpView();
    });

    let suncalcLoaded = false;

    function sunFromClock(hour, month) {
      const dayLen = 8 + 7.5 * Math.cos((month - 6) * Math.PI / 6);
      const sunrise = 12 - dayLen / 2;
      const sunset = 12 + dayLen / 2;
      const span = Math.max(0.5, sunset - sunrise);
      const t = (hour - sunrise) / span;
      const peak = 0.35 + 0.7 * Math.max(0, Math.cos((month - 6) * Math.PI / 6));
      const altitude = Math.sin(Math.max(0, Math.min(1, t)) * Math.PI) * peak - 0.02;
      const azimuth = -Math.PI / 2 + Math.max(0, Math.min(1, t)) * Math.PI;
      return { altitude, azimuth };
    }

    function updateSun() {
      const hour = parseFloat(document.getElementById("sun-hour").value);
      const month = parseInt(document.getElementById("sun-month").value, 10);
      const h = Math.floor(hour);
      const m = Math.round((hour - h) * 60);
      document.getElementById("sun-hour-val").textContent = `${h}:${m.toString().padStart(2, "0")}`;
      document.getElementById("sun-month-val").textContent = MONTHS[month - 1];

      let altitude;
      let azimuth;
      if (suncalcLoaded && typeof SunCalc !== "undefined") {
        const date = new Date(2026, month - 1, 21, h, m);
        const lat = (kitData && kitData.site && kitData.site.lat) || STELLE_LAT;
        const lon = (kitData && kitData.site && kitData.site.lon) || STELLE_LON;
        const sunPos = SunCalc.getPosition(date, lat, lon);
        altitude = sunPos.altitude;
        azimuth = sunPos.azimuth;
      } else {
        const approx = sunFromClock(hour, month);
        altitude = approx.altitude;
        azimuth = approx.azimuth;
      }

      if (altitude > 0) {
        const dist = 80;
        const x = dist * Math.sin(azimuth) * Math.cos(altitude);
        const y = dist * Math.sin(altitude);
        const z = dist * Math.cos(azimuth) * Math.cos(altitude);
        sun.position.set(x, Math.max(y, 8), z);
        sun.target.position.set(0, 0, 2);
        sun.castShadow = true;
        const elev = Math.max(0.2, Math.sin(altitude));
        sun.intensity = 0.85 + 1.35 * elev;
        ambient.intensity = 0.28 + 0.18 * elev;
        hemi.intensity = 0.28 + 0.18 * elev;
        topFill.intensity = 0.12;
      } else {
        sun.position.set(0, 10, 0);
        sun.castShadow = false;
        sun.intensity = 0.06;
        ambient.intensity = 0.18;
        hemi.intensity = 0.06;
        topFill.intensity = 0.03;
      }
    }

    document.getElementById("sun-hour").addEventListener("input", updateSun);
    document.getElementById("sun-month").addEventListener("input", updateSun);

    function loadSunCalc() {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js";
      script.onload = () => {
        suncalcLoaded = true;
        updateSun();
      };
      script.onerror = () => {
        console.warn("SunCalc failed to load, using default sun position");
      };
      document.head.appendChild(script);
    }

    function resize() {
      const w = wrap.clientWidth, h = wrap.clientHeight;
      camera.aspect = w / h;
      applyProjection();
      renderer.setSize(w, h);
      labelRenderer.setSize(w, h);
    }
    window.addEventListener("resize", resize);
    resize();

    const compassRose = document.getElementById("compass-rose");
    const _northA = new THREE.Vector3();
    const _northB = new THREE.Vector3();
    function updateCompass() {
      if (northUpMode) {
        compassRose.style.transform = "none";
        return;
      }
      _northA.copy(controls.target).project(camera);
      _northB.set(0, 0, 25).add(controls.target).project(camera);
      const angle = Math.atan2(_northB.x - _northA.x, _northB.y - _northA.y);
      compassRose.style.transform = `rotate(${angle}rad)`;
    }

    function tick() {
      requestAnimationFrame(tick);
      if (!camAnimating) {
        controls.update();
        syncViewFromPolar();
      }
      updateCompass();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    function init() {
      const dataEl = document.getElementById("kit-data");
      const data = JSON.parse(dataEl.textContent);
      buildScene(data);
      
      applyNorthUpView(true);
      updateSun();
      statusEl.textContent = "Ziehen neigt · Kompass, Doppelklick oder Esc: Aufsicht · Rad zoomt";
      
      tick();
      
      loadSunCalc();
      initSyncLazy();
    }

    init();
  </script>
</body>
</html>
